name: CI / Puerta de Calidad y Seguridad

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Node ${{ matrix.node-version }} - Guard, Tests, Robots y Seguridad
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Instalar dependencias limpias
        run: npm ci

      - name: 0. Autor único en git (ninguna IA ni tercero como contribuidor)
        # Canario sobre el historial publicado: si alguna vez entra un commit
        # firmado por otro (un asistente, Dependabot fusionado tal cual, otra
        # máquina), esto lo dice. Los hooks .githooks/ ya lo impiden al commitear
        # y al empujar; aquí se comprueba además lo que YA está en el remoto.
        # Solo en push/dispatch: en un PR, el merge commit de GitHub y los commits
        # del propio bot darían un falso positivo antes de fusionar.
        if: github.event_name != 'pull_request'
        run: npm run git:auditar

      - name: 1. Restricciones del proyecto (20 reglas)
        run: npm run guard

      - name: 2. Suite de pruebas completa (777 pruebas)
        run: npm test

      - name: 3. Robots de prueba masiva rápida y persistencia
        run: npm run robots:rapido

      - name: 4. Presupuestos y métricas de calidad
        run: npm run metrics

      - name: 5. Auditoría de seguridad de dependencias
        run: npm audit --audit-level=high

      - name: Publicar informe de calidad como artefacto
        if: always() && matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: informe-de-calidad
          path: |
            quality/REPORT.md
            quality/history.ndjson
          retention-days: 30

      - name: Publicar resumen en GitHub Step Summary
        if: always() && matrix.node-version == 22
        run: cat quality/REPORT.md >> "$GITHUB_STEP_SUMMARY" || true

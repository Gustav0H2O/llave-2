<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script>
  // Captura errores antes de cargar el index
  const errors = [];
  const origError = console.error;
  console.error = function(...args) {
    errors.push(args.map(a => {
      try { return a.stack || String(a); } catch (e) { return String(a); }
    }).join(' '));
    origError.apply(console, args);
  };
  window.addEventListener('error', e => errors.push('ERROR: ' + e.message + ' @ ' + e.filename + ':' + e.lineno + ':' + e.colno));
  window.addEventListener('unhandledrejection', e => errors.push('PROMISE: ' + (e.reason?.message || e.reason)));
  setTimeout(() => {
    document.body.innerText = errors.join('\n\n') || 'no errors';
  }, 8000);
</script>
<iframe src="/" style="width:100%;height:100%;border:0"></iframe>
</body>
</html>

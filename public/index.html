    position: fixed; z-index: 65; left: 12px; right: 12px;
    bottom: calc(12px + env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 12px;
    padding: 12px 12px 12px 14px; border-radius: var(--r-lg);
    background: var(--panel); border: 1px solid var(--border-hi);
    box-shadow: 0 12px 32px var(--sunken); animation: instalar-in .22s ease-out;
  }
  @keyframes instalar-in { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .instalar-banner { animation: none; } }
  @media (max-width: 720px) { .instalar-banner { bottom: calc(72px + env(safe-area-inset-bottom)); } }
  @media (min-width: 721px) { .instalar-banner { left: auto; width: 380px; max-width: calc(100vw - 24px); } }
  .instalar-txt { flex: 1; min-width: 0; }
  .instalar-txt strong { display: block; font: 600 13.5px var(--font); color: var(--text); }
  .instalar-txt span { display: block; font: 500 11.5px var(--font); color: var(--muted); line-height: 1.45; }
  .instalar-si {
    flex: none; min-height: 42px; padding: 10px 15px; border-radius: var(--r-sm);
    background: var(--accent-fill); border: 1px solid var(--accent-fill); color: var(--accent-ink);
    font: 700 11.5px var(--font); cursor: pointer; touch-action: manipulation;
  }
  .instalar-no {
    flex: none; width: 40px; min-height: 42px; border-radius: var(--r-sm);
    background: none; border: 1px solid var(--border); color: var(--muted);
    cursor: pointer; touch-action: manipulation;
    display: inline-flex; align-items: center; justify-content: center;
  }

  /* ── 11. Sin conexión ───────────────────────────────────────────── */
  /* En el taller la señal se cae en la fosa y detrás de la cortina de
     metal. Que la app siga respondiendo con lo cacheado pero sin decirlo
     es peor que no funcionar: el mecánico no sabe si el dato es de hoy. */
  .sin-red {
    position: fixed; z-index: 80; left: 0; right: 0; top: 0;
    padding: calc(7px + env(safe-area-inset-top)) 14px 7px;
    background: var(--amber-soft); border-bottom: 1px solid var(--amber-dim);
    color: var(--amber); font: 600 12px var(--font); text-align: center;
  }
  body.sin-red-activo .home-nav { top: 34px; }

  /* ── 12. Teléfono en horizontal ─────────────────────────────────── */
  /* Girado quedan 390 px de ALTO y el hero se los comía entero. Pasa de
     verdad: el celular apoyado en el guardabarros se gira para ver una
     tabla ancha. */
  @media (max-height: 460px) and (orientation: landscape) {
    .home-hero { padding-top: 22px; padding-bottom: 22px; }
    .home-hero-title { font-size: clamp(24px, 5vw, 34px); }
    .home-hero-visual { display: none; }
    .home-tabbar { position: static; }
    .home-body { padding-bottom: 24px; }
  }

  /* ── 13. Buscador de herramientas (dentro de la barra) ──────────────
     Va en la barra superior como en el brief de marca. Antes era una banda
     suelta debajo: se leía como un añadido y en el celular se iba con el
     scroll, justo cuando más falta hace para no recorrer 38 tarjetas. */
  .home-buscador { position: relative; flex: 1 1 260px; max-width: 400px; }
  .home-buscador .styled-input {
    padding-left: 38px; padding-right: 40px; border-radius: var(--r-full);
    background: var(--panel2); border-color: transparent;
  }
  .home-buscador .styled-input:focus-visible { border-color: var(--accent); background: var(--panel); }
  .home-buscador-ic {
    position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    color: var(--icon); display: inline-flex; pointer-events: none;
  }
  .home-buscador-x {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    width: 34px; height: 34px; border-radius: 50%; background: none; border: 0;
    color: var(--muted); cursor: pointer; touch-action: manipulation;
    display: inline-flex; align-items: center; justify-content: center;
  }

  .home-cat-desc--corta { display: none; }
  @media (max-width: 720px) {
    .home-cat-desc--larga { display: none; }
    .home-cat-desc--corta { display: block; }
    /* el titular de categoría no compite con las tarjetas, que es a lo que
       se viene: baja de 28 a 21 px y el bloque entero de 300 a 90 px */
    .home-cat-title { font-size: 21px; }
    .home-cat-head { margin-bottom: 16px; }
    .home-cat-desc { margin-top: 6px; }
  }

  /* ── 14. Botón secundario y cotizador ───────────────────────────────
     `.home-cta-ghost` no tenía NINGUNA regla: se pintaba con el botón por
     defecto del navegador —gris de sistema, tipografía ajena, sin estados—
     en el segundo CTA del hero ("Ver guías") y en los dos "+ Agregar" del
     cotizador. Es el secundario del sistema, así que se define aquí con el
     mismo lenguaje que `.tool-add-btn`: mismo alto, mismo radio, relleno
     vacío y borde en vez de acento. */
  .home-cta-ghost {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    padding: 12px 18px; border-radius: var(--r-sm); cursor: pointer;
    touch-action: manipulation;
    background: transparent; border: 1px solid var(--border-hi); color: var(--text);
    font: 600 13px var(--font); letter-spacing: 0;
    transition: background .15s, border-color .15s, color .15s;
  }
  .home-cta-ghost:hover { background: var(--accent-soft); border-color: var(--accent-dim); color: var(--accent); }
  .home-cta-ghost:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (max-width: 720px) {
    /* Los datos del cliente son campos de texto con etiquetas largas
       ("WhatsApp (con código de país)"): en dos columnas de 175 px la
       etiqueta se partía en dos líneas y descuadraba los campos entre sí.
       Los de tarifas son números cortos y sí caben pareados. */
    .quote-params--ancho { grid-template-columns: 1fr; }
    /* La línea de presupuesto envolvía dejando la ✕ sola en una fila. En dos
       filas explícitas —qué es arriba, cuánto y borrar abajo— cada control
       cae donde se espera y el subtotal queda junto a su línea. */
    .quote-line {
      display: grid; grid-template-columns: 1fr auto auto; gap: 8px;
      align-items: center; padding-bottom: 10px; margin-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .quote-line > .styled-input:first-child { grid-column: 1 / -1; }
    .quote-line .quote-narrow { flex: none !important; width: 92px; min-width: 0 !important; }
    .quote-line .quote-sub { min-width: 0; margin-left: auto; }
    .quote-add { width: 100%; }
  }

  /* ── 15. Tableta y portátil estrecho (721-1023 px) ──────────────────
     Por encima de 720 px vuelve el menú superior, pero las seis categorías
     más la marca y la cuenta no caben en una fila hasta pasados los 1000 px:
     medido a 768 px, la barra se envolvía en dos filas de 121 px de alto y
     volvía a empujar el contenido hacia abajo, que es justo lo que se acaba
     de arreglar en el celular. Se deja UNA fila que se desliza con el dedo,
     que es como se recorre un menú largo en una tableta. */
  @media (min-width: 721px) and (max-width: 1023px) {
    .home-nav { flex-wrap: nowrap; }
    .home-nav-links { margin: 0 4px 0 auto; }
  }

  /* ── 16. Ilustraciones de marca ─────────────────────────────────────
     Dos dibujos a lápiz del brief: el personaje y la fachada del taller. */


  /* La fachada del taller, sólo en la sección del ecosistema. El dibujo trae un
     cartel en blanco arriba —x 29-71 %, y 5,5-29 % de la imagen, medido— y ahí
     es donde tiene que caer el titular de la sección: por eso el fondo se ancla
     arriba y centrado, y el relleno superior está calculado para que el
     bloque del encabezado aterrice dentro del cartel. */
  .home-ecosystem { position: relative; isolation: isolate; }
  .home-ecosystem::before {
    content: ''; position: absolute; inset: 0; z-index: -1;
    background: url('/media/fondo-taller.jpg') top center / cover no-repeat;
  }
  /* Es lápiz sobre papel blanco: en tema oscuro hay que apagarlo, pero NO
     invirtiéndolo. `invert(1)` lo dejaba en negativo —papel negro, trazo
     blanco, el taller en rayos X— y se leía como un error de render en mitad
     de la página. Bajar el brillo conserva el dibujo: papel gris oscuro, trazo
     casi negro, y el rótulo queda en un gris sobre el que el titular crema
     mide ~8:1, de sobra para AA. */
  :root[data-theme="dark"] .home-ecosystem::before,
  :root[data-theme="dark"] .home-ecosystem::after { filter: brightness(.22) contrast(1.05); opacity: .85; }
  /* El encabezado se sienta dentro del cartel. El cartel mide el 23,5 % del
     alto de la imagen, así que el bloque tiene que quedar corto: la bajada se
     recorta a dos líneas y el aire de debajo lo pone la rejilla. */
  /* El relleno superior de la sección se recorta para que el bloque suba al
     cartel: medido a 1440, el titular caía 40 px por debajo del marco. */
  /* El relleno de abajo no es aire: con `cover`, la escala la manda el alto de
     la sección, así que agrandarla agranda el cartel —siempre el 23,5 % del
     alto— hasta que caben los tres bloques de texto. Y lo que ocupa ese hueco
     es la propia ilustración: el suelo del taller bajo las tarjetas. */
  .home-ecosystem { padding-top: clamp(66px, 5.6vw, 82px); padding-bottom: clamp(120px, 25vw, 380px); }
  @media (max-width: 720px) { .home-ecosystem { padding-top: 100px; } }
  /* La bajada baja de 16 a 15 px y estrecha su caja: son tres bloques dentro
     de un cartel que mide el 23,5 % del alto de la sección, y cada línea de
     más los empuja fuera del marco. */
  .home-ecosystem-head p { font-size: 15px; max-width: 52ch; }
  /* Sin degradado: la ilustración se ve de arriba abajo y las tarjetas se
     apoyan encima. Son opacas (--panel), así que el dibujo no les estorba la
     lectura; lo único que hacía falta era subir su sombra para despegarlas. */
  .home-eco-card { box-shadow: 0 10px 30px -14px rgba(31, 42, 26, .45); }

  /* Celular. Va DESPUÉS de la regla de escritorio a propósito: estaba escrito
     200 líneas más arriba y, al tener la misma especificidad, la de escritorio
     le ganaba por orden y el degradado móvil no se aplicaba nunca. */


  /* ── 17. La sección del ecosistema en celular ───────────────────────
     En escritorio una sola capa basta: la sección se acerca a la relación de
     la ilustración y `cover` deja el cartel arriba y el taller detrás de las
     tarjetas. En un celular la sección es 3,5 veces más alta que ancha, y con
     `cover` la escala la manda el alto: la imagen se amplía al 640 % y el
     taller se convierte en un montón de líneas sueltas.

     Se parte en dos capas, cada una con su trabajo:
       ::before  sólo el cartel, muy ampliado, para que quepan los TRES bloques
                 de texto. A esa escala se ve el interior blanco del rótulo,
                 sin marco: es un panel limpio donde el titular se lee.
       ::after   el taller a tamaño reconocible, anclado abajo, detrás de las
                 tarjetas. */
  @media (max-width: 720px) {
    .home-ecosystem::before {
      background-size: 500% auto;
      -webkit-mask-image: linear-gradient(180deg, #000 0, #000 24%, transparent 33%);
      mask-image: linear-gradient(180deg, #000 0, #000 24%, transparent 33%);
    }
    .home-ecosystem::after {
      content: ''; position: absolute; left: 0; right: 0; bottom: 0; z-index: -1;
      height: 72%;
      background: url('/media/fondo-taller.jpg') bottom center / 148% auto no-repeat;
      -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 22%, #000 100%);
      mask-image: linear-gradient(180deg, transparent 0, #000 22%, #000 100%);
    }
  }

</style>

<!-- (capa "trazo de taller" eliminada — la dirección editorial del sistema
     "llave" pide superficies limpias y radios suaves, no marcos dibujados
     a mano. Ver DESIGN.md §0.) -->

    position: relative; z-index: 10;
    backdrop-filter: blur(12px);
  }
  /* Cada sección de la losa: la etiqueta lleva la línea horizontal de rótulo
     técnico que ya usan los `h2` de `.panel`, en vez de ir centrada. */
  .home-sec {
    padding: clamp(44px, 6vw, 76px) clamp(22px, 5vw, 56px);
    border-top: 1px solid var(--surface-card-border);
  }
  .home-sec:first-child { border-top: none; }
  .home-sec--alt { background: var(--surface-slab-2); }
  .home-about-title {
    display: flex; align-items: center; gap: 14px;
    font: 700 12px var(--font); letter-spacing: 1.4px; text-transform: uppercase;
    color: var(--label); margin-bottom: 10px;
  }
  .home-about-title::after {
    content: ''; flex: 1; height: 1px;
    background: linear-gradient(90deg, var(--label-rule), transparent 80%);
  }
  .home-sec-lead {
    font: 500 15px var(--font); color: var(--text-alt); line-height: 1.75;
    max-width: 66ch; margin-bottom: 32px;
  }
  .home-sec-lead strong { color: var(--text); font-weight: 700; }

  /* "Qué es": cuatro columnas de prosa, sin tarjeta. El bloque explica, no
     invita a tocar — meterlo en tarjetas lo haría parecer clicable. */
  .home-what { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 30px 36px; margin-top: 30px; }
  .home-what-col h3 {
    font: 700 10.5px var(--font); letter-spacing: 1.3px; text-transform: uppercase;
    color: var(--label); margin-bottom: 10px; padding-bottom: 10px;
    border-bottom: 1px solid var(--surface-card-border);
  }
  .home-what-col p { font: 500 13px var(--font); color: var(--text-alt); line-height: 1.75; }

  .home-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
  /* Las tarjetas son <button>: abren su categoría. Antes eran <div> con
     aspecto de tarjeta clicable que no hacía nada.
     El hover NO usa sombra: `clip-path` recorta todo lo que sale de la caja,
     así que la sombra sería invisible. El realce va en borde y fondo. */
  .home-card-item {
    border: 1px solid var(--surface-card-border); clip-path: var(--bevel);
    background: var(--surface-card); padding: 30px 28px;
    display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
    text-align: left; cursor: pointer; touch-action: manipulation; font-family: var(--font);
    transition: transform .22s cubic-bezier(.16,1,.3,1), border-color .22s, background .22s;
  }
  /* --surface-card-hover y no --panel2: en oscuro --panel2 es rgba(36,41,45,.9),
     prácticamente el mismo color que --surface-card, así que el hover cambiaba
     el borde pero no el fondo. */
  .home-card-item:hover {
    transform: translateY(-4px); border-color: var(--accent-dim); background: var(--surface-card-hover);
  }
  .home-card-item:active { transform: translateY(-1px); }
  .home-card-item:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { .home-card-item, .home-card-item:hover { transform: none; transition: none; } }
  .home-card-ic {
    display: inline-flex; color: var(--icon); margin-bottom: 10px;
    background: var(--neutral-soft-2); padding: 12px; border-radius: var(--r-sm);
  }
  .home-card-item h3 { font: 700 16px var(--font); letter-spacing: -.2px; color: var(--text); }
  .home-card-item p { font: 500 13px var(--font); color: var(--text-alt); line-height: 1.7; }
  .home-card-go {
    margin-top: auto; padding-top: 12px; display: inline-flex; align-items: center; gap: 6px;
    font: 700 10.5px var(--font); letter-spacing: 1.4px; text-transform: uppercase; color: var(--accent);
    transition: gap .2s;
  }
  .home-card-item:hover .home-card-go { gap: 11px; }

  .home-aud-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
  .home-aud-grid > div {
    display: flex; flex-direction: column; gap: 6px; background: var(--surface-card);
    border: 1px solid var(--surface-card-border); clip-path: var(--bevel); padding: 22px;
  }
  .home-aud-grid strong { font: 800 14px var(--font); color: var(--text); }
  .home-aud-grid span { font: 500 12px var(--font); color: var(--text-alt); line-height: 1.55; }
  .home-aud-ic { display: inline-flex; color: var(--icon); margin-bottom: 12px; }

  /* ---- cierre con llamada a la acción ---- */
  .home-close {
    display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap;
    border-top: 1px solid var(--accent-dim);
  }
  .home-close h2 { font: 800 clamp(19px, 2.4vw, 26px)/1.2 var(--font); color: var(--text); letter-spacing: -.4px; margin-bottom: 8px; }
  .home-close p { font: 500 13.5px var(--font); color: var(--text-alt); line-height: 1.6; max-width: 56ch; }
  .home-close-cta { display: flex; flex-wrap: wrap; gap: 10px; flex: 0 1 auto; max-width: 100%; }
  .home-close-cta > * { max-width: 100%; }
  /* En pantalla angosta los dos botones pasan a ancho completo apilados: con
     `flex: none` el de "Crear cuenta del taller" se salía del viewport. */
  @media (max-width: 560px) {
    .home-close-cta { width: 100%; }
    .home-close-cta > * { flex: 1 1 100%; justify-content: center; text-align: center; }
  }

  /* ---- "Cómo funciona": tres pasos numerados ---- */
  .home-steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 22px; counter-reset: paso; }
  .home-step {
    position: relative; padding: 24px 22px 22px;
    background: var(--surface-card); border: 1px solid var(--surface-card-border); clip-path: var(--bevel);
  }
  .home-step::before {
    counter-increment: paso; content: counter(paso, decimal-leading-zero);
    display: block; margin-bottom: 12px;
    font: 700 30px var(--font); letter-spacing: -1px; color: var(--label-rule); opacity: 1;
  }
  .home-step h3 { font: 800 14px var(--font); color: var(--text); margin-bottom: 6px; }
  .home-step p { font: 500 13px var(--font); color: var(--text-alt); line-height: 1.7; }

  /* ---- Cobertura: cifras grandes ---- */
  .home-facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 18px; }
  .home-fact {
    padding: 20px; background: var(--surface-card);
    border: 1px solid var(--surface-card-border); border-radius: var(--r-lg);
  }
  .home-fact b { display: block; font: 800 26px var(--font); color: var(--text); letter-spacing: -.8px; }
  .home-fact span { font: 600 10px var(--font); letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); }

  /* ---- FAQ: <details> nativo, sin JS ---- */
  .home-faq { display: flex; flex-direction: column; gap: 12px; max-width: 900px; }
  .home-faq details {
    background: var(--surface-card); border: 1px solid var(--surface-card-border);
    border-radius: var(--r-lg); padding: 0;
  }
  .home-faq summary {
    cursor: pointer; touch-action: manipulation; list-style: none;
    padding: 20px 24px; font: 600 14px var(--font); color: var(--text);
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
  }
  .home-faq summary::-webkit-details-marker { display: none; }
  .home-faq summary::after {
    content: '+'; flex: none; font: 400 20px var(--font); color: var(--muted); line-height: 1;
  }
  .home-faq details[open] summary::after { content: '−'; }
  .home-faq summary:hover { color: var(--accent); }
  .home-faq summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .home-faq p { padding: 0 24px 22px; font: 500 13.5px var(--font); color: var(--text-alt); line-height: 1.75; max-width: 68ch; }

  /* ---- Quién lo hace ---- */
  .home-author { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 24px; align-items: start; }
  @media (max-width: 760px) { .home-author { grid-template-columns: 1fr; } }
  .home-author p { font: 500 13.5px var(--font); color: var(--text-alt); line-height: 1.7; margin-bottom: 12px; max-width: 68ch; }
  .home-author-card {
    background: var(--surface-card); border: 1px solid var(--surface-card-border);
    clip-path: var(--bevel); padding: 22px;
  }
  .home-author-card dt { font: 600 9.5px var(--font); letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); }
  .home-author-card dd { font: 600 13px var(--font); color: var(--text); margin-bottom: 14px; }
  .home-author-card dd:last-child { margin-bottom: 0; }
  /* padding vertical para que el enlace sea tocable, con margen negativo para
     que no descuadre la rejilla de definiciones */
  .home-author-card a, .home-author-card .link-btn {
    display: inline-block; padding: 8px 0; margin: -8px 0; color: var(--accent);
  }

  /* ---- cabecera de categoría + grilla de apps ---- */
  .home-cat-head { margin-bottom: 26px; }
  .home-cat-title { font: 700 clamp(22px, 3vw, 28px) var(--font); letter-spacing: -.5px; color: var(--text); }
  .home-cat-desc { font: 500 13.5px var(--font); color: var(--muted); margin-top: 10px; max-width: 62ch; line-height: 1.75; }
  .home-group-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
  /* La grilla de micro apps es la navegación principal del producto: 38 tarjetas
     repartidas en cinco categorías. El fondo iba en grafito literal
     (rgba(26,30,33,.82)) mientras el texto seguía a --text, así que en tema
     claro quedaba tinta casi negra sobre una plancha oscura: 1.19:1 en la
     descripción y 1.86:1 en el título, medidos en el navegador. Con los tokens
     --surface-* el aspecto en oscuro es el mismo y en claro pasa a ser legible. */
  .micro-card {
    display: flex; flex-direction: column; gap: 9px; text-align: left; cursor: pointer; touch-action: manipulation;
    background: var(--surface-card); border: 1px solid var(--surface-card-border); border-radius: var(--r-lg);
    padding: 20px 18px 18px; color: var(--text); backdrop-filter: blur(6px);
    transition: border-color .18s, background .18s, transform .18s;
    font-family: var(--font);
  }
  /* sin box-shadow: el clip-path del bisel la recortaría y no se vería */
  .micro-card:hover {
    border-color: var(--accent-dim); background: var(--surface-card-hover);
    transform: translateY(-3px);
  }
  @media (prefers-reduced-motion: reduce) { .micro-card, .micro-card:hover { transform: none; transition: none; } }
  /* Candado de "requiere cuenta": insignia con el mismo lenguaje que los badges
     de la ficha, no un emoji de 9px suelto dentro del título. */
  .micro-card-lock {
    display: inline-flex; align-items: center; gap: 4px; vertical-align: 1px; margin-left: 6px;
    padding: 2px 6px; background: var(--amber-soft); border: 1px solid var(--amber-dim); color: var(--amber);
    font: 700 8.5px var(--font); letter-spacing: 1px; text-transform: uppercase; font-style: normal;
  }
  .micro-card:active { transform: translateY(0); }
  .micro-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .micro-card-icon { color: var(--icon); display: flex; }
  .micro-card-title { font: 600 14px var(--font); letter-spacing: -.1px; }
  .micro-card-desc { font: 500 12px var(--font); color: var(--text-alt); line-height: 1.6; }
  /* ---- pie ampliado ---- */
  .home-footer {
    margin-top: 40px; padding: clamp(30px, 5vw, 46px) clamp(20px, 5vw, 40px) 26px;
    background: var(--surface-slab-2); border-top: 1px solid var(--border);
    color: var(--muted); font: 500 12px var(--font);
  }
  .home-footer-grid {
    max-width: 1200px; margin: 0 auto;
    display: grid; grid-template-columns: minmax(0, 1.5fr) repeat(auto-fit, minmax(150px, 1fr)); gap: 28px;
  }
  .home-footer-brand .logo-lockup { width: min(100%, 190px); margin-bottom: 12px; }
  .home-footer-brand p { line-height: 1.65; max-width: 42ch; }
  .home-footer h4 {
    font: 700 10px var(--font); letter-spacing: 1.3px; text-transform: uppercase;
    color: var(--label); margin-bottom: 14px;
  }
  .home-footer ul { list-style: none; display: flex; flex-direction: column; gap: 2px; }
  /* padding vertical, no gap: así el área tocable del enlace llega a ~36px en
     vez de los 15px de la caja del texto */
  .home-footer a, .home-footer .link-btn {
    display: inline-block; padding: 9px 0; color: var(--text-alt);
    text-decoration: none; font-size: 12px; text-align: left;
  }
  .home-footer a:hover, .home-footer .link-btn:hover { color: var(--accent); text-decoration: underline; }
  .home-footer-bottom {
    max-width: 1200px; margin: 26px auto 0; padding-top: 18px;
    border-top: 1px solid var(--border);
    display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: space-between;
    font-size: 11px; letter-spacing: .5px;
  }

  /* Mismo fallo que .micro-card y misma corrección: estos tres nacieron con
     grafito literal y en tema claro pintaban islas oscuras con texto --text
     encima. Van por token. */
  .login-card { border: 1px solid var(--surface-card-border); border-radius: var(--r-lg); background: var(--surface-card); }
  .match-badge { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent-dim); border-radius: var(--r-sm); font: 700 10px var(--font); padding: 2px 6px; }
  .diag-opt { background: var(--sunken); }
  .diag-opt:hover { border-color: var(--accent-dim); }

  @media (max-width: 720px) {
    .home-nav { flex-wrap: wrap; gap: 6px; }
    .home-nav-links { order: 3; width: 100%; justify-content: center; }
    .home-nav-user { margin-left: auto; }
  }

  /* vista de micro app */
  .micro-app-view { min-height: 100vh; padding: clamp(30px, 4vw, 48px) clamp(18px, 3vw, 24px) 80px; }
  .micro-shell { max-width: 900px; margin: 0 auto; }
  .micro-shell-head {
    display: flex; align-items: center; gap: 14px; margin-bottom: 28px;
    padding-bottom: 18px; border-bottom: 1px solid var(--border);
  }
  .micro-shell-head h2 { font: 700 20px var(--font); letter-spacing: -.3px; color: var(--text); margin: 0; }
  .micro-shell-ic { display: inline-flex; color: var(--icon); flex: none; }
  .micro-back {
    display: inline-flex; align-items: center; gap: 7px; flex: none;
    cursor: pointer; touch-action: manipulation;
    background: var(--panel2); border: 1px solid var(--border-hi); color: var(--text);
    padding: 9px 15px 9px 11px; min-height: 38px; border-radius: var(--r-sm);
    font: 700 11px var(--font); letter-spacing: 1.2px; text-transform: uppercase;
    transition: background .15s, color .15s, border-color .15s;
  }
  .micro-back:hover { background: var(--accent-soft-2); color: var(--accent); border-color: var(--accent-dim); }
  .micro-back:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 480px) {
    .micro-shell-head { flex-wrap: wrap; }
    .micro-shell-head h2 { font-size: 16px; }
  }
  .micro-shell-body { display: flex; flex-direction: column; gap: 14px; }

  /* tablas */
  .mic-tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .mic-tbl th {
    text-align: left; font: 700 10px var(--font); letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--label); padding: 8px 10px; border-bottom: 1px solid var(--border-hi);
    /* el `overflow-wrap: anywhere` global partía los encabezados a mitad de
       palabra ("AMPER / AJE"): en una celda de tabla el ancho lo negocia el
       propio table-layout, no hace falta romper palabras */
    overflow-wrap: normal; hyphens: none;
  }
  .mic-tbl td { overflow-wrap: break-word; }
  /* Acción dentro de una fila: el texto subrayado de `.link-btn` mide 20px de
     alto y no se acierta con el dedo. Aquí se convierte en botón compacto. */
  .mic-tbl td .link-btn {
    display: inline-flex; align-items: center; min-height: 34px; padding: 6px 12px;
    text-decoration: none; border: 1px solid var(--border); border-radius: var(--r-sm);
    font: 700 10px var(--font); letter-spacing: 1.1px; text-transform: uppercase;
    white-space: nowrap; transition: background .14s, border-color .14s;
  }
  .mic-tbl td .link-btn:hover { background: var(--accent-soft-2); border-color: var(--accent-dim); }
  /* Con una acción de 34px en la fila, el `vertical-align: top` heredado dejaba
     el texto arriba y el botón abajo: la fila se leía torcida. */
  .mic-tbl.tbl-acciones td { vertical-align: middle; }
  /* columnas de magnitud: la cifra y su unidad no se separan nunca */
  .mic-tbl .num { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .mic-tbl td { padding: 9px 10px; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: top; }
  .mic-tbl tr:hover td { background: var(--neutral-soft); }

  /* ---- piezas compartidas por las micro apps ---- */
  .mic-lead { font: 500 13.5px var(--font); color: var(--text-alt); line-height: 1.75; max-width: 66ch; margin-bottom: 24px; }
  .mic-sub {
    font: 700 11px var(--font); letter-spacing: 1.4px; text-transform: uppercase; color: var(--label);
    margin: 30px 0 14px; display: flex; align-items: center; gap: 14px;
  }
  .mic-sub::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--label-rule), transparent 80%); }
  .mic-sub:first-child { margin-top: 0; }
  .mic-lbl { display: block; font: 600 10px var(--font); letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }

  /* ---- fusibles ----
     La muestra de color no es decoración: la tabla ES el código de colores, y
     leer "canela" sin verlo no ayuda a nadie frente a una caja de fusibles.
     El nombre en texto se queda porque el color solo nunca debe ser el único
     portador de la información. */
  .fuse-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 8px; }
  .fuse-chip {
    display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center;
    padding: 11px 13px; background: var(--sunken); border: 1px solid var(--border); border-radius: var(--r-lg);
  }
  .fuse-dot {
    grid-row: span 2; width: 20px; height: 20px; flex: none;
    border: 1px solid var(--hairline); box-shadow: inset 0 0 0 1px rgba(0,0,0,.25);
  }
  .fuse-chip b { font: 800 14px var(--font); color: var(--text); white-space: nowrap; }
  .fuse-chip span { font: 500 11px var(--font); color: var(--muted); }

  /* ---- llantas ---- */
  .tire-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
  .tire-col { display: flex; flex-direction: column; gap: 6px; }
  .tire-inputs { display: flex; align-items: center; gap: 6px; }
  .tire-inputs .styled-input { width: 100%; min-width: 0; text-align: center; padding: 10px 6px; }
  .tire-inputs span { font: 700 13px var(--font); color: var(--muted); flex: none; }
  .tire-verdict {
    display: flex; align-items: baseline; gap: 10px; margin-top: 20px; padding: 16px 20px;
    background: var(--accent-soft); border-left: 3px solid var(--accent); border-radius: var(--r-lg);
  }
  .tire-verdict b { font: 800 30px var(--font); color: var(--accent); letter-spacing: -1px; }
  .tire-verdict span { font: 600 11px var(--font); letter-spacing: 1.4px; text-transform: uppercase; color: var(--text-alt); }
  .tire-verdict.bad { background: var(--amber-soft); border-left-color: var(--amber); }
  .tire-verdict.bad b { color: var(--amber); }
  .tire-kv { margin-top: 16px; }

  /* ---- inspección ---- */
  .insp-head { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .insp-progress {
    display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: space-between; align-items: center;
    padding: 12px 16px; background: var(--sunken); border: 1px solid var(--border); border-radius: var(--r-lg);
    font: 500 12px var(--font); color: var(--text-alt);
  }
  .insp-progress strong { color: var(--text); font-size: 15px; }
  .insp-tally { display: flex; gap: 12px; }
  .insp-tally em { font: 700 11px var(--font); font-style: normal; letter-spacing: .6px; }
  .insp-tally .ok { color: var(--accent); }
  .insp-tally .warn { color: var(--amber); }
  .insp-tally .bad { color: var(--danger); }
  .insp-group { margin-top: 4px; }
  .insp-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    padding: 9px 0; border-bottom: 1px solid var(--border);
    font: 500 13px var(--font); color: var(--text);
  }
  .insp-btns { display: flex; gap: 5px; flex: none; }
  .insp-btn {
    padding: 6px 12px; cursor: pointer; touch-action: manipulation; min-height: 32px;
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    font: 700 9.5px var(--font); letter-spacing: 1.1px; text-transform: uppercase;
    border-radius: var(--r-sm); transition: background .14s, color .14s, border-color .14s;
  }
  .insp-btn:hover { border-color: var(--border-hi); color: var(--text); }
  .insp-btn.ok.on { background: var(--accent-soft-2); border-color: var(--accent-dim); color: var(--accent); }
  .insp-btn.warn.on { background: var(--amber-soft); border-color: var(--amber-dim); color: var(--amber); }
  .insp-btn.bad.on { background: var(--danger-soft); border-color: var(--danger-dim); color: var(--danger); }
  .insp-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }

  /* ---- cotizador ---- */
  .quote-params { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .quote-line { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .quote-line .styled-input { flex: 1; min-width: 120px; }
  .quote-narrow { flex: 0 0 88px !important; min-width: 72px !important; text-align: right; }
  .quote-sub { flex: none; min-width: 92px; text-align: right; font: 700 13px var(--font); color: var(--text); font-variant-numeric: tabular-nums; }
  .quote-del {
    flex: none; width: 32px; min-height: 32px; cursor: pointer; touch-action: manipulation;
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    border-radius: var(--r-sm); transition: color .14s, border-color .14s;
  }
  .quote-del:hover:not(:disabled) { color: var(--danger); border-color: var(--danger-dim); }
  /* Misma razón que en .tool-add-btn: a `opacity: .3` la ✕ quedaba en 1.6:1 y
     el botón de borrar la línea del presupuesto era invisible, no "inactivo". */
  .quote-del:disabled { opacity: .55; cursor: default; }
  /* El cuerpo de MicroShell es un flex en columna, así que sus hijos se estiran
     por defecto: sin esto, "Agregar trabajo" ocupaba todo el ancho del panel y
     pesaba visualmente más que el botón primario. */
  .quote-add { margin-top: 2px; align-self: flex-start; }
  .quote-total { margin-top: 22px; }
  .quote-grand {
    display: flex; align-items: baseline; justify-content: space-between; gap: 14px;
    margin-top: 12px; padding: 16px 20px;
    background: var(--accent-soft); border-left: 3px solid var(--accent); border-radius: var(--r-lg);
  }
  .quote-grand span { font: 700 11px var(--font); letter-spacing: 2px; text-transform: uppercase; color: var(--text-alt); }
  .quote-grand b { font: 800 26px var(--font); color: var(--accent); letter-spacing: -.8px; font-variant-numeric: tabular-nums; }

  /* ---- citas ---- */
  .cita-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .cita-item {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 12px 15px; margin-bottom: 8px;
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--r-lg);
  }
  .cita-item.hoy { border-color: var(--accent-dim); background: var(--accent-soft); }
  .cita-item.done { opacity: .5; }
  .cita-when {
    flex: none; min-width: 160px; font: 700 12px var(--font); color: var(--text);
    text-transform: capitalize; display: flex; align-items: center; gap: 8px;
  }
  .cita-when em {
    font: 700 9px var(--font); font-style: normal; letter-spacing: 1.2px; text-transform: uppercase;
    background: var(--accent-fill); color: var(--accent-ink); padding: 2px 6px;
  }
  .cita-body { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 140px; }
  .cita-body strong { font: 700 13px var(--font); color: var(--text); }
  .cita-body span { font: 500 12px var(--font); color: var(--text-alt); }
  .cita-acts { display: flex; gap: 12px; flex: none; }

  /* ---- ajustes de combustible (trims) ---- */
  .trim-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
  .trim-field { display: flex; flex-direction: column; }
  .trim-hint { font: 500 10px var(--font); color: var(--muted); margin-top: 4px; }
  .trim-totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin: 20px 0 4px; }
  .trim-total {
    display: flex; flex-direction: column; gap: 2px; padding: 16px 18px;
    background: var(--sunken); border: 1px solid var(--border);
    border-left: 3px solid var(--border-hi); border-radius: var(--r-lg);
  }
  .trim-total span { font: 600 10px var(--font); letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted); }
  .trim-total b { font: 800 26px var(--font); letter-spacing: -.8px; color: var(--text); font-variant-numeric: tabular-nums; }
  .trim-total em { font: 700 11px var(--font); font-style: normal; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
  .trim-total.ok { border-left-color: var(--accent); background: var(--accent-soft); }
  .trim-total.ok b, .trim-total.ok em { color: var(--accent); }
  .trim-total.warn { border-left-color: var(--amber); background: var(--amber-soft); }
  .trim-total.warn b, .trim-total.warn em { color: var(--amber); }
  .trim-total.bad { border-left-color: var(--danger); background: var(--danger-soft); }
  .trim-total.bad b, .trim-total.bad em { color: var(--danger); }
  .trim-diag {
    margin: 16px 0; padding: 18px 20px; background: var(--panel2);
    border: 1px solid var(--border); border-left: 3px solid var(--border-hi); border-radius: var(--r-lg);
  }
  .trim-diag.ok { border-left-color: var(--accent); }
  .trim-diag.warn { border-left-color: var(--amber); }
  .trim-diag.bad { border-left-color: var(--danger); }
  .trim-diag h3 { font: 800 14px var(--font); color: var(--text); margin-bottom: 10px; }
  .trim-diag p { font: 500 13px var(--font); color: var(--text-alt); line-height: 1.65; margin-bottom: 8px; max-width: 74ch; }
  .trim-diag p:last-child { margin-bottom: 0; }

  /* ---- compresión ---- */
  .comp-setup { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 18px; align-items: end; }
  .comp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 10px; }
  .comp-cyl { display: flex; flex-direction: column; }
  .comp-cyl .styled-input { text-align: center; font-variant-numeric: tabular-nums; }

  /* ---- aviso de verificación de correo ----
     Ámbar, no rojo: la cuenta funciona igual, es una advertencia y no un fallo.
     Va debajo de la barra y por encima del hero, sin taparlo. */
  .verify-banner {
    position: relative; z-index: 40;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    max-width: 1200px; margin: 14px auto 0; width: calc(100% - clamp(24px, 6vw, 40px));
    padding: 14px 18px; border-radius: var(--r-lg);
    background: var(--amber-soft); border: 1px solid var(--amber-dim); border-left: 3px solid var(--amber);
  }
  .verify-ic { display: inline-flex; color: var(--amber); flex: none; }
  .verify-body { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 200px; }
  .verify-body strong { font: 800 13px var(--font); color: var(--text); }
  .verify-body span { font: 500 12px var(--font); color: var(--text-alt); line-height: 1.5; }
  .verify-dev { color: var(--amber) !important; font-size: 11.5px !important; }
  .verify-dev a { color: var(--amber); }

  /* ---- perfil del taller ---- */
  .prof-mail {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 16px 18px; margin-bottom: 4px; border-radius: var(--r-lg);
    background: var(--sunken); border: 1px solid var(--border); border-left: 3px solid var(--border-hi);
  }
  .prof-mail > div { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 180px; }
  .prof-mail strong { font: 700 13px var(--font); color: var(--text); }
  .prof-mail span { font: 500 12px var(--font); color: var(--text-alt); line-height: 1.5; }
  .prof-mail .icon { flex: none; }
  .prof-mail.ok { border-left-color: var(--accent); }
  .prof-mail.ok .icon { color: var(--accent); }
  .prof-mail.warn { border-left-color: var(--amber); background: var(--amber-soft); }
  .prof-mail.warn .icon { color: var(--amber); }

  /* ---- editor del perfil público ---- */
  .prof-toggle {
    display: flex; align-items: flex-start; gap: 12px; cursor: pointer;
    padding: 14px 16px; border-radius: var(--r-lg);
    background: var(--sunken); border: 1px solid var(--border);
  }
  /* El área tocable real es la etiqueta entera, que envuelve la casilla; el
     cuadrito solo tiene que verse bien y no fallarse con el dedo. */
  .prof-toggle input { width: 22px; height: 22px; flex: none; margin-top: 1px; accent-color: var(--accent-fill); }
  @media (pointer: coarse) { .prof-toggle input { width: 26px; height: 26px; } }
  .prof-toggle span { display: flex; flex-direction: column; gap: 3px; }
  .prof-toggle strong { font: 700 13px var(--font); color: var(--text); }
  .prof-toggle em { font: 500 12px var(--font); font-style: normal; color: var(--text-alt); line-height: 1.5; }
  .prof-share {
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    margin-top: 16px; padding: 16px 18px; border-radius: var(--r-lg);
    background: var(--accent-soft); border: 1px solid var(--accent-dim); border-left: 3px solid var(--accent);
  }
  .prof-share code {
    display: block; font: 600 12.5px ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--accent); word-break: break-all;
  }
  .prof-share-cta { display: flex; flex-wrap: wrap; gap: 8px; }
  .prof-share-cta a { text-decoration: none; }

  /* ---- perfil público visto por el cliente ---- */
  .pp-head { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
  .pp-rating { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .pp-rating b { font: 800 34px var(--font); color: var(--text); letter-spacing: -1px; }
  .pp-rating em { font: 600 11px var(--font); font-style: normal; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }
  .pp-stars { color: var(--accent); font-size: 16px; letter-spacing: 2px; }
  .pp-meta { display: flex; flex-direction: column; gap: 6px; }
  .pp-meta span { display: inline-flex; align-items: center; gap: 7px; font: 600 12px var(--font); color: var(--text-alt); }
  .pp-verificado { color: var(--accent) !important; }
  .pp-servicios { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; }
  .pp-servicios span {
    padding: 5px 11px; border-radius: var(--r-sm);
    background: var(--neutral-soft-2); border: 1px solid var(--border); color: var(--text-alt);
    font: 600 11px var(--font); letter-spacing: .4px;
  }
  .pp-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; align-items: end; }
  /* Estaba declarado en tres bloques separados que se pisaban: uno pedía
     `flex-direction: column` y otro `row` treinta líneas más abajo. Ganaba el
     último por orden de fuente, así que la columna era código muerto que
     engañaba a quien leyera solo el primer bloque. Consolidado en uno. */
  .pp-rate {
    display: flex; flex-direction: row; align-items: center; flex-wrap: wrap;
    gap: 4px; border: none; padding: 0; margin: 0; position: relative;
  }
  .pp-rate legend { padding: 0; width: 100%; }
  .pp-star {
    background: none; border: none; cursor: pointer; touch-action: manipulation;
    font-size: 30px; line-height: 1; padding: 2px 3px; color: var(--neutral-soft-3);
    transition: color .12s;
  }
  .pp-star.on { color: var(--accent); }
  .pp-star:hover { color: var(--accent-strong); }
  .pp-star:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pp-lista { display: flex; flex-direction: column; gap: 10px; }
  .pp-review {
    padding: 14px 16px; border-radius: var(--r-lg);
    background: var(--panel); border: 1px solid var(--border);
  }
  .pp-review header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 5px; }
  .pp-review strong { font: 700 13px var(--font); color: var(--text); }
  .pp-review p { font: 500 12.5px var(--font); color: var(--text-alt); line-height: 1.6; }

  /* ---- WhatsApp ---- */
  .cli-wa {
    display: inline-flex; align-items: center; min-height: 30px; padding: 5px 11px;
    cursor: pointer; touch-action: manipulation; border-radius: var(--r-sm);
    background: var(--accent-soft-2); border: 1px solid var(--accent-dim); color: var(--accent);
    font: 700 9.5px var(--font); letter-spacing: 1.1px; text-transform: uppercase;
    transition: background .14s;
  }
  .cli-wa:hover { background: var(--accent-soft); }
  @media (pointer: coarse) { .cli-wa { min-height: 40px; } }
  .quote-hint { font: 500 12px var(--font); color: var(--amber); margin-top: 10px; }

  /* ---- árbol "no enciende" ---- */
  .ns-opts { display: flex; flex-direction: column; gap: 9px; max-width: 620px; }
  .ns-opt {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    padding: 16px 18px; cursor: pointer; touch-action: manipulation; text-align: left;
    background: var(--panel2); border: 1px solid var(--border); border-radius: var(--r-lg);
    color: var(--text); font: 600 13.5px var(--font); font-family: var(--font);
    transition: background .15s, border-color .15s, transform .15s;
  }
  .ns-opt:hover { background: var(--accent-soft-2); border-color: var(--accent-dim); transform: translateX(3px); }
  .ns-opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ns-opt .icon { color: var(--icon); }
  @media (prefers-reduced-motion: reduce) { .ns-opt, .ns-opt:hover { transform: none; transition: none; } }

  /* ---- batería ---- */
  .bat-grid { display: flex; flex-direction: column; gap: 10px; }
  .bat-row {
    display: grid; grid-template-columns: minmax(0, 260px) 1fr; gap: 10px 22px; align-items: center;
    padding: 14px 16px; background: var(--sunken);
    border: 1px solid var(--border); border-left: 3px solid var(--border-hi); border-radius: var(--r-lg);
  }
  @media (max-width: 620px) { .bat-row { grid-template-columns: 1fr; } }
  .bat-field { display: flex; flex-direction: column; }
  .bat-verdict { font: 600 12.5px var(--font); color: var(--muted); line-height: 1.55; }
  .bat-row.ok { border-left-color: var(--accent); }
  .bat-row.ok .bat-verdict { color: var(--accent); }
  .bat-row.warn { border-left-color: var(--amber); background: var(--amber-soft); }
  .bat-row.warn .bat-verdict { color: var(--amber); }
  .bat-row.bad { border-left-color: var(--danger); background: var(--danger-soft); }
  .bat-row.bad .bat-verdict { color: var(--danger); }

  /* ---- pinouts ---- */
  /* Los pines de norma (masa, CAN, alimentación) llevan realce: son los que se
     miden. Los "libre para el fabricante" se quedan en gris para no competir. */
  .pin-key td { background: var(--accent-soft); }
  .pin-key td:first-child { box-shadow: inset 3px 0 0 var(--accent); }

  /* ---- mantenimiento ---- */
  .maint-tbl .maint-iv { width: 92px; padding: 6px 8px; text-align: right; font-size: 12.5px; }
  /* El borde izquierdo tiñe la fila entera sin depender solo del color del texto */
  .maint-tbl tr.maint-ok td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
  .maint-tbl tr.maint-warn td:first-child { box-shadow: inset 3px 0 0 var(--amber); }
  .maint-tbl tr.maint-bad td:first-child { box-shadow: inset 3px 0 0 var(--danger); }
  .maint-tbl tr.maint-bad td strong { color: var(--danger); }
  .maint-tbl tr.maint-warn td strong { color: var(--amber); }
  .maint-tbl td:first-child { padding-left: 12px; }

  /* DTC */
  .dtc-list { display: flex; flex-direction: column; gap: 8px; }
  .dtc-item { display: flex; gap: 12px; padding: 11px 14px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--r-lg); }
  .dtc-code { flex: none; font: 700 13px var(--font); color: var(--text); letter-spacing: .3px; padding-top: 1px; font-variant-numeric: tabular-nums; }
  .dtc-body { display: flex; flex-direction: column; gap: 2px; }
  .dtc-body strong { font: 600 13px var(--font); color: var(--text); }
  .dtc-body span { font: 500 12px var(--font); color: var(--text-alt); line-height: 1.45; }

  /* conversor */
  .conv-modes { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .conv-mode {
    padding: 8px 14px; cursor: pointer; touch-action: manipulation;
    background: var(--panel2); border: 1px solid var(--border); color: var(--muted);
    font: 700 10.5px var(--font); letter-spacing: 1px; text-transform: uppercase; border-radius: var(--r-sm);
    transition: background .15s, color .15s, border-color .15s;
  }
  .conv-mode.active { background: var(--accent-soft); border-color: var(--accent-dim); color: var(--accent); }
  .conv-body { display: flex; flex-direction: column; gap: 14px; max-width: 340px; }
  .conv-out { font: 800 34px var(--font); color: var(--text); font-variant-numeric: tabular-nums; }
  .conv-out span { font: 500 14px var(--font); color: var(--muted); }
  .conv-out2 { font: 600 15px var(--font); color: var(--muted); }

  /* VIN */
  .vin-card { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--r-lg); }
  .vin-line { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
  .vin-line span { color: var(--muted); }
  .vin-line strong { color: var(--text); font-variant-numeric: tabular-nums; }

  /* presión */
  .pres-form { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .pres-form .styled-input { max-width: 200px; }
  .pres-stats { display: flex; gap: 16px; flex-wrap: wrap; font: 600 12.5px var(--font); color: var(--muted); margin-bottom: 10px; }
  .pres-stats strong { color: var(--accent); }
  .pres-list { display: flex; flex-direction: column; gap: 6px; }
  .pres-item { display: flex; align-items: center; gap: 14px; padding: 10px 14px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--r-lg); font-size: 13px; flex-wrap: wrap; }
  .pres-psi { font: 700 14px var(--font); color: var(--text); }
  .pres-psi em { font-style: normal; color: var(--muted); font-size: 12px; }
  .pres-veh { color: var(--text-alt); font-weight: 600; }
  .pres-ts { margin-left: auto; color: var(--muted); font-size: 11px; }

  /* regulador */
  .reg-step { padding: 20px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--r-lg); }
  .reg-prog { height: 5px; background: var(--neutral-soft-2); border-radius: var(--r-full); overflow: hidden; margin-bottom: 16px; }
  .reg-prog div { height: 100%; background: linear-gradient(90deg, var(--accent-fill-strong), var(--accent-fill)); transition: width .25s; }
  .reg-q { font: 600 15px var(--font); color: var(--text); margin-bottom: 16px; }
  .reg-ans { display: flex; gap: 10px; flex-wrap: wrap; }
  .reg-btn-no {
    padding: 11px 18px; cursor: pointer; touch-action: manipulation;
    background: var(--panel2); border: 1px solid var(--danger-dim); color: var(--danger);
    font: 700 11px var(--font); letter-spacing: 1px; text-transform: uppercase; border-radius: var(--r-sm);
  }
  .reg-verdict { padding: 18px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--r-lg); display: flex; flex-direction: column; gap: 12px; }
  .reg-verdict.ok { border-color: var(--accent-dim); }
  .reg-verdict.ok strong { color: var(--accent); }
  .reg-verdict.bad { border-color: var(--danger-dim); }
  .reg-verdict.bad strong { color: var(--danger); }
  .reg-a { font-size: 13px; color: var(--text); }
  .reg-a.ok em { color: var(--accent); font-style: normal; }
  .reg-a.bad em { color: var(--danger); font-style: normal; }

  /* órdenes */
  .order-stats { display: flex; gap: 16px; flex-wrap: wrap; font: 600 12px var(--font); }
  .order-list { display: flex; flex-direction: column; gap: 8px; }
  .order-item { padding: 12px 14px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--r-lg); }
  .order-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .order-head strong { font: 700 14px var(--font); color: var(--text); }
  .order-date { margin-left: auto; color: var(--muted); font-size: 11px; }
  .order-desc { font: 500 13px var(--font); color: var(--text-alt); margin: 6px 0 10px; line-height: 1.5; }
  .order-foot { display: flex; align-items: center; gap: 12px; }
  .order-status {
    background: var(--input-bg); color: var(--text); border: 1px solid var(--border);
    border-radius: var(--r-full); padding: 5px 12px; font: 700 10.5px var(--font); letter-spacing: .5px; cursor: pointer;
  }
  .order-status.st-pendiente { color: var(--amber); border-color: var(--amber-dim); }
  .order-status.st-en-proceso { color: var(--accent); border-color: var(--accent-dim); }
  .order-status.st-listo { color: var(--text); border-color: var(--border-hi); }

  /* inventario */
  .inv-form { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  .inv-form .styled-input { flex: 1; min-width: 120px; }
  .inv-form .tool-add-btn { align-self: stretch; }
  .inv-list { display: flex; flex-direction: column; gap: 6px; }
  .inv-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--r-lg); font-size: 13px; flex-wrap: wrap; }
  .inv-item.low { border-color: var(--amber-dim); background: var(--amber-soft); }
  .inv-name { flex: 1; font-weight: 600; }
  .inv-qty { display: flex; align-items: center; gap: 8px; }
  .inv-qty strong { font: 800 16px var(--font); font-variant-numeric: tabular-nums; }
  .inv-qty strong.low { color: var(--amber); }
  .inv-btn {
    width: 26px; height: 26px; cursor: pointer; touch-action: manipulation;
    background: var(--panel2); border: 1px solid var(--border-hi); color: var(--text);
    border-radius: var(--r-sm); font: 800 14px var(--font); display: flex; align-items: center; justify-content: center;
  }
  .inv-btn:hover { border-color: var(--accent-dim); color: var(--accent); }

  /* clientes */
  .cli-form { margin-bottom: 4px; }
  .cli-list { display: flex; flex-direction: column; gap: 8px; }
  .cli-item { padding: 12px 14px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--r-lg); display: flex; flex-direction: column; gap: 4px; }

  /* notas */
  .note-form { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  .note-form .styled-input:nth-child(2) { flex: 1; min-width: 200px; }
  .note-list { display: flex; flex-direction: column; gap: 8px; }
  .note-item { padding: 12px 14px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--r-lg); }
  .note-veh { font: 700 10.5px var(--font); letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
  .note-item p { font: 500 13.5px var(--font); color: var(--text); margin: 6px 0 4px; }

  /* caja */
  .cash-totals { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
  .cash-today, .cash-all { flex: 1; min-width: 160px; padding: 16px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--r-lg); display: flex; flex-direction: column; gap: 4px; }
  .cash-today span, .cash-all span { font: 700 10px var(--font); letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
  .cash-today strong { font: 800 24px var(--font); color: var(--accent); }
  .cash-all strong { font: 800 24px var(--font); color: var(--text); }
  .cash-form { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  .cash-form .styled-input { flex: 1; min-width: 130px; }
  .cash-list { display: flex; flex-direction: column; gap: 6px; }
  .cash-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--r-lg); font-size: 13px; }
  .cash-type { font-weight: 800; }
  .cash-type.ingreso { color: var(--accent); }
  .cash-type.egreso { color: var(--danger); }
  .cash-concept { flex: 1; }
  .cash-amount { font: 700 14px var(--font); font-variant-numeric: tabular-nums; }
  .cash-amount.ingreso { color: var(--accent); }
  .cash-amount.egreso { color: var(--danger); }

  /* foro */
  .forum-new { display: flex; gap: 10px; margin-bottom: 14px; }
  .forum-new .styled-input { flex: 1; }
  .forum-list { display: flex; flex-direction: column; gap: 8px; }
  .forum-thread { background: var(--panel); border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; }
  .forum-thread-head { width: 100%; text-align: left; padding: 12px 14px; cursor: pointer; background: none; border: none; color: var(--text); font-family: var(--font); display: flex; flex-direction: column; gap: 3px; }
  .forum-thread-head:hover { background: var(--neutral-soft); }

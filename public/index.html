/* Tema: se resuelve ANTES del primer pintado para que no haya destello.
   Va inline y sin defer a propósito — un archivo externo llegaría tarde.
   El default es "light" (lienzo editorial #F8F7F3). El usuario puede
   elegir dark o auto (que sigue la preferencia del sistema) desde el
   selector de tema en el panel lateral. */
(function () {
  try {
    var pref = localStorage.getItem('llave_theme');        // 'light' | 'dark' | 'auto' | null
    if (pref === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    else if (pref === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
      document.documentElement.setAttribute('data-theme', 'dark');
    else document.documentElement.setAttribute('data-theme', 'light');
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
})();
</script>

<style>
  /* ================================================================
     Sistema visual "llave"
     ----------------------------------------------------------------
     Marca: llave · taller mecánico → marca digital premium.
     Verde #3F5132 como acento estratégico (no saturado), blanco
     cálido #F8F7F3 como lienzo editorial, negro carbón #111311
     como tinta, gris metálico #9A9B91 como metadatos.

     Roles semánticos (no intercambiables, en un taller el color
     es la primera lectura):
       verde  (--accent) = marca, acción, dato confirmado
       ámbar (--amber)   = incertidumbre, advertencia, trabajo extra
       rojo  (--danger)  = falla real: corto, circuito abierto, error

     El tema se resuelve con [data-theme] en <html>; el script del
     <head> estampa el atributo antes del primer pintado para evitar
     destello. El default editorial es light sobre #F8F7F3; el dark
     mode (#111311) se activa con [data-theme="dark"] o cuando el
     sistema lo pide y el usuario no ha elegido otra cosa.
     ================================================================ */
  :root {
    /* ---- Acento de marca: verde estratégico ---------------------------
       El verde de marca funciona como relleno sólido y como tinta de
       acción primaria. Mide ~7.8:1 sobre #F8F7F3 (AA Large + Normal). */
    --accent: #3F5132;
    --accent-strong: #2E3D24;          /* hover de relleno sólido */
    --accent-olive: #7B8968;           /* verde oliva secundario */
    --accent-olive-soft: rgba(123, 137, 104, .14);
    --accent-olive-soft-2: rgba(123, 137, 104, .26);
    --accent-ink: #F8F7F3;            /* texto sobre relleno verde */
    --accent-fill: #3F5132;
    --accent-fill-strong: #4F6740;
    --accent-soft: rgba(63, 81, 50, .08);
    --accent-soft-2: rgba(63, 81, 50, .16);
    --accent-dim: rgba(63, 81, 50, .42);
    --accent-glow: rgba(63, 81, 50, .22);
    /* alias heredados: three3d.js y admin.js siguen pidiendo --red */
    --red: var(--accent); --red-dim: var(--accent-dim);

    /* ---- Estados: ámbar y rojo mantienen su rol ----------------------- */
    --danger: #B8341E; --danger-dim: rgba(184, 52, 30, .42); --danger-soft: rgba(184, 52, 30, .08);
    --amber: #8A5A00; --amber-dim: rgba(138, 90, 0, .34); --amber-soft: rgba(138, 90, 0, .08);

    /* ---- Lienzo editorial: blanco cálido, jerarquía en alpha negro ---- */
    --bg: #F8F7F3;
    --panel: #FFFFFF;
    --panel2: #F1EFEA;
    --card: #FFFFFF;
    --border: #E5E2DA;
    --border-hi: #C9C6BC;
    --ink: #111311;
    --ink-2: #2A2C26;
    --muted: #6B6D64;
    --steel: #9A9B91;
    --label: #111311;
    --label-rule: #E5E2DA;
    --icon: rgba(17, 19, 17, .44);
    --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --v3d-bg: radial-gradient(ellipse at 50% 40%, #f5f4ee 0%, #e8e6df 90%);
    --v3d-hint: rgba(17, 19, 17, .55);
    --bg-glass: rgba(248, 247, 243, .85);
    --bg-glass-strip: rgba(248, 247, 243, .82);
    --bg-glass-tip: rgba(248, 247, 243, .92);
    --bg-fade: rgba(248, 247, 243, .85);
    --input-bg: #FFFFFF;
    --sunken: #F1EFEA;
    --text-alt: #2A2C26;
    --alert-text: #6B4A00;
    --neutral-soft: rgba(17, 19, 17, .04);
    --neutral-soft-2: rgba(17, 19, 17, .07);
    --neutral-soft-3: rgba(17, 19, 17, .11);
    --scroll-thumb: rgba(17, 19, 17, .22);
    --hairline: rgba(17, 19, 17, .08);
    --shadow-lg: 0 12px 32px rgba(17, 19, 17, .08);
    --shadow-sm: 0 1px 2px rgba(17, 19, 17, .04);

    /* ---- Radios: escala suave ligada al lenguaje de la marca ---------
       El brief pide formas redondeadas que recuerden llaves y dados.
       Saltamos de 8/10/14 → 10/14/22/32. */
    --bevel-sm: none; --bevel: none; --bevel-lg: none;
    --r-sm: 10px;     /* chips, insignias, inputs, botones compactos */
    --r:    14px;     /* botones, tarjetas pequeñas, campos */
    --r-lg: 22px;     /* tarjetas y contenedores */
    --r-xl: 32px;     /* losa del hero, bloques destacados */
    --r-full: 999px;

    /* ---- Superficies del home explicativo: la "losa" se monta sobre
       el hero y flota tarjetas encima. Tokens para que el color siga
       al tema. La forma (radio, elevación) se conserva. */
    --surface-slab: rgba(17, 19, 17, .03);
    --surface-slab-2: rgba(17, 19, 17, .05);
    --surface-card: #FFFFFF;
    --surface-card-hover: rgba(17, 19, 17, .04);
    --surface-card-border: #E5E2DA;
    --surface-shadow: 0 16px 40px rgba(17, 19, 17, .08);
    --surface-card-shadow: 0 1px 2px rgba(17, 19, 17, .04);
    --surface-card-shadow-hi: 0 12px 26px rgba(17, 19, 17, .10);
    /* Velo sobre la foto de motor del dashboard: blanco cálido editorial */
    --home-scrim:
      radial-gradient(ellipse 900px 500px at 50% 0%, rgba(248, 247, 243, .5), transparent),
      linear-gradient(180deg, rgba(248, 247, 243, .85) 0%, rgba(248, 247, 243, .95) 40%, rgba(248, 247, 243, 1) 100%);
    /* Logo: un solo SVG con fill="currentColor" — controlamos el color
       por el contenedor padre. Light mode: verde. */
    color-scheme: light;
  }

  /* ---- Dark mode: lienzo #111311, mismas formas --------------------

     nunca como texto sobre #111311 sin alpha. */
  :root[data-theme="dark"] {
    --accent: #6F8A5A;
    --accent-strong: #8AA571;
    --accent-olive: #9DAE89;
    --accent-olive-soft: rgba(157, 174, 137, .16);
    --accent-olive-soft-2: rgba(157, 174, 137, .28);
    --accent-ink: #111311;
    --accent-fill: #6F8A5A;
    --accent-fill-strong: #8AA571;
    --accent-soft: rgba(111, 138, 90, .16);
    --accent-soft-2: rgba(111, 138, 90, .28);
    --accent-dim: rgba(111, 138, 90, .52);
    --accent-glow: rgba(111, 138, 90, .28);
    --red: var(--accent); --red-dim: var(--accent-dim);
    --danger: #E0635A; --danger-dim: rgba(224, 99, 90, .45); --danger-soft: rgba(224, 99, 90, .10);
    --amber: #E6B14A; --amber-dim: rgba(230, 177, 74, .45); --amber-soft: rgba(230, 177, 74, .10);
    /* Superficies un escalón arriba (#1A1C18 → #1F231C) y filos de .10/.20 a
       .14/.26: sobre #111311 un panel a 4 puntos de luminancia del fondo y un
       borde al 10 % no se distinguen del lienzo, y el oscuro se leía como una
       plancha negra sin jerarquía. Se calientan hacia el verde de marca para
       que sea grafito verdoso, no negro puro. */
    --bg: #111311;
    --panel: #1F231C;
    --panel2: #2A2F26;
    --card: #1F231C;
    --border: rgba(248, 247, 243, .14);
    --border-hi: rgba(248, 247, 243, .26);
    --ink: #F8F7F3;
    --ink-2: #D2CFC5;
    --muted: #A3A599;
    --steel: #9A9B91;
    --label: #F8F7F3;
    --label-rule: rgba(248, 247, 243, .14);
    --icon: rgba(248, 247, 243, .44);
    --v3d-bg: radial-gradient(ellipse at 50% 40%, #1a1c18 0%, #111311 90%);
    --v3d-hint: rgba(248, 247, 243, .55);
    --bg-glass: rgba(17, 19, 17, .85);
    --bg-glass-strip: rgba(17, 19, 17, .82);
    --bg-glass-tip: rgba(17, 19, 17, .8);
    --bg-fade: rgba(17, 19, 17, .78);
    --input-bg: rgba(248, 247, 243, .07);
    --sunken: rgba(248, 247, 243, .05);
    --text-alt: #D2CFC5;
    --alert-text: #F5C542;
    --neutral-soft: rgba(248, 247, 243, .04);
    --neutral-soft-2: rgba(248, 247, 243, .08);
    --neutral-soft-3: rgba(248, 247, 243, .14);
    --scroll-thumb: rgba(248, 247, 243, .22);
    --hairline: rgba(248, 247, 243, .10);
    --shadow-lg: 0 12px 32px rgba(0, 0, 0, .55);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
    --surface-slab: rgba(248, 247, 243, .06);
    --surface-slab-2: rgba(248, 247, 243, .04);
    --surface-card: #1F231C;
    --surface-card-hover: rgba(248, 247, 243, .09);
    --surface-card-border: rgba(248, 247, 243, .14);
    --surface-shadow: 0 16px 40px rgba(0, 0, 0, .45);
    --surface-card-shadow: 0 1px 2px rgba(0, 0, 0, .35);
    --surface-card-shadow-hi: 0 12px 26px rgba(0, 0, 0, .55);
    --home-scrim:
      radial-gradient(ellipse 900px 500px at 50% 0%, rgba(17, 19, 17, .5), transparent),
      linear-gradient(180deg, rgba(17, 19, 17, .78) 0%, rgba(17, 19, 17, .92) 40%, rgba(17, 19, 17, 1) 100%);
    color-scheme: dark;
}
  /* El default es SIEMPRE light editorial (lienzo #F8F7F3), sin importar
     la preferencia del sistema. El dark mode (#111311) solo se activa con
     [data-theme="dark"] explícito — el usuario lo elige con el selector de
     tres estados (auto / claro / oscuro) en el panel lateral. Es una
     decisión de producto: la marca "llave" se presenta editorial y clara
     en su forma canónica, no en grafito. */

  /* OJO: aquí había una `}` de más. Un `}` suelto en el nivel superior es un
     error de sintaxis y la recuperación del parser se tragaba la regla de
     abajo entera, así que el reset base NUNCA estuvo activo: `body` llevaba
     los 8 px de margen del navegador y cada campo sumaba su relleno por fuera
     del ancho. En el buscador la página se iba a 410 px dentro de un teléfono
     de 390 y Android la encogía para que cupiera. Si vuelves a tocar el bloque
     de arriba, cuenta las llaves. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* reset clave para responsividad: por defecto, un hijo de flex/grid no se encoge
     más allá de su contenido ("min-width:auto" = min-content), lo que empuja overflow
     horizontal fuera de pantalla en vez de envolver el texto. min-width:0 lo neutraliza
     en todo el sitio (los anchos explícitos, como .result-item o .rl-nav, no se ven
     afectados porque ya tienen flex:none). */
  * { min-width: 0; }
  html { scrollbar-color: var(--scroll-thumb) var(--bg); -webkit-tap-highlight-color: transparent; }
  @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
  body {
    background: var(--bg); color: var(--text); font: 15px/1.58 var(--font);
    min-height: 100vh; overflow-x: hidden; overflow-wrap: anywhere;
  }
  .skip-link {
    position: absolute; left: 12px; top: -60px; z-index: 100;
    background: var(--accent-fill); color: var(--accent-ink); font: 700 12px var(--font); letter-spacing: 1px;
    padding: 10px 16px; border-radius: var(--r-sm); transition: top .15s;
  }
  .skip-link:focus { top: 12px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
  /* Foco visible por defecto en TODO lo interactivo. Los componentes que quieran
     otro tratamiento (inputs con halo, tarjetas de resultado) lo sobrescriben. */
  :where(a, button, select, input, textarea, [tabindex]):focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-sm);
  }
  .icon { display: inline-flex; flex: none; vertical-align: -3px; color: currentColor; }
  .icon svg { display: block; }
  .mark-icon svg { stroke-width: 1.8; }
  .icon.spin svg { animation: ft-spin 1s linear infinite; }
  @media (prefers-reduced-motion: reduce) { .icon.spin svg { animation-duration: 2.6s; } }
  @keyframes ft-spin { to { transform: rotate(360deg); } }
  /* Fondo neutro, sin degradados de acento ni textura de grano: la separación
     la hace el aire y las superficies, no el ornamento. */
  body::before { content: none; }
  body::after { content: none; }
  #root { position: relative; z-index: 2; }

  /* ---------- shell: filtros a un lado | resultados + ficha juntos del otro ---------- */
  .app-shell {
    display: flex; min-height: 100vh; align-items: stretch;
    /* respeta el notch/isla dinámica en landscape sin recortar contenido */
    padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right);
  }

  .search-pane {
    width: 480px; flex: none; position: sticky; top: 0; 
    height: 100vh; max-height: 100dvh;
    background: var(--bg-glass); border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    /* clamp en vez de un salto brusco por breakpoint: se achica de forma continua
       en cualquier ancho, incluyendo tallas intermedias que ningún breakpoint cubre */
    padding: clamp(20px, 6vw, 36px) clamp(14px, 5vw, 34px) 24px;
    /* Solo en dos columnas: aquí el panel SÍ es una caja de alto fijo pegada al
       viewport y necesita su propio scroll. En una sola columna se anula (ver
       el bloque de 900px), o el contenido queda atrapado. */
    overflow-y: auto;
  }
  /* ---------- logotipo ----------
     Dos PNG del manual de marca (versión clara y versión oscura). Se muestran
     con display, no con filter/opacity, para que ninguna de las dos se
     descargue "a medias" ni se degrade el lima corporativo. */
  /* Centrado en la columna. Se probó a la izquierda cuando el logotipo era
     grande, porque entonces el hueco lateral se leía como aire suyo; a su
     tamaño actual el centrado equilibra mejor con el selector de tema, que
     también va centrado justo debajo. */
  .search-pane .logo-block { display: flex; align-items: center; justify-content: center; margin-bottom: 22px; flex: none; }
  /* El logo se sirve en dos SVG precoloreados (verde para fondo claro, crema
     para fondo oscuro). El CSS muestra uno y oculta el otro según el tema,
     sin parpadeo y sin depender de JS — igual que el sistema anterior con
     --logo-dark / --logo-light, pero con un solo atributo data-theme. */
  /* Escala del logotipo, medida por ALTO y no por ancho.

     Es lo que hace que se vea alineado: la marca es apaisada (2,6:1), así que
     84 px de ancho son 34 de alto y al lado de un icono de 24 px canta, aunque
     el número parezca modesto. Fijando el alto, logotipo, iconos y texto
     comparten línea óptica. El ancho lo pone la relación real del trazo, de
     modo que no puede deformarse.

       xl  marca principal de una pantalla
       m   cabecera. NO es el alto del icono del menú: se probó y se queda
           corto, porque un icono es un glifo compacto y la marca es una
           palabra. A igual altura de caja la palabra pesa menos. ~1,35x el
           icono es lo que hace que los dos tengan la misma presencia.
       s   en línea con texto de 13-14 px  */
  :root { --logo-h-xl: 52px; --logo-h-m: 32px; --logo-h-s: 24px; }
  .logo-img { height: var(--logo-h-xl); width: auto; max-width: 100%; display: block; }
  .logo-img--light { display: block; }
  .logo-img--dark  { display: none; }
  :root[data-theme="dark"] .logo-img--light { display: none; }
  :root[data-theme="dark"] .logo-img--dark  { display: block; }
  /* Sin pareja `:root:not([data-theme])`, aquí ni en toda la hoja: NO hay
     estado sin atributo — el script del <head> lo estampa antes del primer
     pintado y applyTheme() lo reestampa siempre, "Auto" incluido. Esas reglas
     no casaban al cargar y sí al pulsar "Auto" en caliente. */
  /* Excepción del hero: debajo hay un video con degradado oscuro, no el
     fondo de la app. El logo del hero es SIEMPRE la versión crema,
     independientemente del tema del usuario. */
  .home-hero .logo-img--light { display: none; }
  .home-hero .logo-img--dark  { display: block; }
  /* isotipo suelto (avatares, cabeceras compactas): ahora el "logo-mark" es la
     palabra "llave" en SVG, escalada. Mismo SVG, mismo currentColor. */
  .logo-mark { height: var(--logo-h-s); width: auto; flex: none; color: var(--accent); }

  /* ---------- selector de tema ----------
     Tres estados explícitos (auto / claro / oscuro) en vez de un interruptor de
     dos: "auto" es el que quiere la mayoría, y sin él elegir manualmente una vez
     dejaría al usuario clavado en ese tema para siempre. */
  .theme-switch {
    display: flex; gap: 2px; padding: 3px; margin: 0 auto 26px;
    background: var(--panel2); border: 1px solid var(--border); border-radius: var(--r-full);
  }
  .theme-switch button {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 7px 13px; border: none; border-radius: var(--r-full); cursor: pointer;
    background: transparent; color: var(--muted); touch-action: manipulation;
    font: 700 9.5px var(--font); letter-spacing: 1.4px; text-transform: none;
    transition: background .18s, color .18s;
  }
  .theme-switch button:hover { color: var(--text); }
  .theme-switch button[aria-pressed="true"] {
    background: var(--accent-fill); color: var(--accent-ink);
  }
  .theme-switch button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- toast de confirmación ----------
     Copiar un enlace o guardar en el garage no cambiaba nada visible: sin
     respuesta el mecánico vuelve a tocar el botón sin saber si funcionó. */
  .toast-stack {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translateX(-50%); z-index: 300;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    pointer-events: none; width: max-content; max-width: calc(100vw - 32px);
  }
  .toast {
    display: flex; align-items: center; gap: 9px;
    background: var(--panel2); border: 1px solid var(--accent-dim);
    border-left: 3px solid var(--accent); color: var(--text);
    padding: 11px 18px; border-radius: var(--r-sm); box-shadow: var(--shadow-lg);
    font: 600 12.5px var(--font); letter-spacing: .3px;
    animation: toast-in .22s ease-out;
  }
  .toast .icon { color: var(--accent); }
  /* Toast de error: borde y acento en rojo para distinguirlo del verde de éxito. */
  .toast-error { border-color: rgba(220, 80, 70, .55); border-left-color: #d45046; }
  .toast-error .icon { color: #d45046; }
  @keyframes toast-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .toast { animation: none; } }

  /* ---------- aviso de privacidad ----------
     Anclado a la IZQUIERDA a propósito: el FAB del chat vive abajo a la derecha
     y ambos son fixed, así que compartir esquina tapaba el botón de aceptar. */
  /* .panel.<clase> y no solo .privacy-notice: `.panel` declara position:relative
     más abajo en la hoja y, a igual especificidad, ganaba por orden de fuente —
     el aviso caía dentro del flujo y estrujaba el panel de contenido. */
  /* Este sí necesita despegarse del fondo: flota sobre el contenido. Va con
     `filter: drop-shadow()` para que siga la silueta del panel redondeado. */
  .panel.privacy-notice {
    position: fixed; z-index: 100; max-width: 340px; padding: 16px;
    left: calc(20px + env(safe-area-inset-left));
    bottom: calc(20px + env(safe-area-inset-bottom));
    filter: drop-shadow(0 8px 22px rgba(0, 0, 0, .35));
  }
  :root[data-theme="light"] .panel.privacy-notice { filter: drop-shadow(0 8px 22px rgba(0, 0, 0, .12)); }
  .privacy-notice h3 {
    display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
    font: 700 13px var(--font); color: var(--text);
  }
  .privacy-notice p { font: 500 11.5px/1.45 var(--font); color: var(--muted); margin-bottom: 14px; }
  /* El enlace medía 14px de alto dentro del párrafo. El relleno vertical con
     margen negativo le da área tocable sin descuadrar el interlineado. */
  .privacy-notice a {
    display: inline-block; padding: 8px 0; margin: -8px 0;
    color: var(--accent); text-underline-offset: 2px;
  }
  @media (pointer: coarse) { .privacy-notice a { display: inline-block; padding: 13px 0; margin: -13px 0; } }
  .privacy-ok {
    width: 100%; cursor: pointer; touch-action: manipulation; min-height: 40px;
    background: var(--accent-fill); color: var(--accent-ink); border: 1px solid var(--accent-fill);
    border-radius: var(--r-sm); font: 600 11.5px var(--font); transition: filter .15s;
  }
  .privacy-ok:hover { filter: brightness(1.1); }
  @media (max-width: 900px) {
    /* en móvil no cabe al lado del FAB: ocupa el ancho y se sienta por encima de él */
    .panel.privacy-notice {
      left: 12px; right: 12px; max-width: none;
      bottom: calc(84px + env(safe-area-inset-bottom));
    }
  }

  /* ---------- esqueleto de carga ----------
     Reserva el mismo espacio que el contenido real, así la ficha no "salta"
     al llegar los datos (evita layout shift y clics accidentales). */
  .skel { display: flex; flex-direction: column; gap: 10px; }
  .skel-line {
    height: 12px; border-radius: var(--r-sm);
    background: linear-gradient(90deg, var(--neutral-soft-2) 25%, var(--neutral-soft-3) 50%, var(--neutral-soft-2) 75%);
    background-size: 200% 100%; animation: skel-shimmer 1.4s ease-in-out infinite;
  }
  @keyframes skel-shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { .skel-line { animation: none; } }

  .search-pane .panel { flex: none; padding: clamp(16px, 4vw, 30px) clamp(14px, 4vw, 28px); }
  .search-pane .filters {
    display: grid; grid-template-columns: 1fr 1fr; gap: 20px 18px;
  }
  /* "Ordenar por" es el quinto campo de una rejilla de dos: se quedaba solo en
     su fila con media columna de hueco al lado. Ocupando el ancho entero la
     fila cierra, y de paso el desplegable deja de recortar "Marca, Modelo,
     Año", que no cabía en 158 px. */
  .search-pane .filters > div:nth-of-type(5) { grid-column: 1 / -1; }
  /* Volver, arriba a la izquierda del panel */
  .pane-back {
    align-self: flex-start; flex: none; margin-bottom: 10px;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 12px 8px 8px; border-radius: var(--r);
    background: transparent; border: 1px solid transparent; cursor: pointer;
    color: var(--ink-2); font: 500 13px var(--font); letter-spacing: 0;
    text-transform: none; touch-action: manipulation;
    transition: color .15s, background .15s, border-color .15s;
  }
  .pane-back:hover { color: var(--accent); background: var(--accent-soft); border-color: var(--accent-dim); }
  .pane-back:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (pointer: coarse) { .pane-back { min-height: 44px; } }
  .search-pane .filters label { margin-bottom: 8px; }
  .search-pane .filters select, .search-pane .filters input { padding: 12px 13px; font-size: 14.5px; max-width: 100%; }
  .search-pane .filters button {
    grid-column: 1 / -1; width: 100%; max-width: 100%; margin-top: 6px;
    padding: 14px clamp(8px, 4vw, 20px); white-space: normal;
  }
  .search-pane .app-footer { flex: none; margin-top: auto; }

  /* ---------- panel derecho: franja de resultados (fija arriba) + ficha técnica debajo ---------- */
  .content-pane { flex: 1; min-width: 0; overflow-y: auto; overscroll-behavior: contain; }
  .results-strip {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg-glass-strip); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border); padding: clamp(14px, 4vw, 22px) clamp(14px, 4vw, 30px);
  }
  .results-strip .rs-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
  .results-strip .rs-head h2 {
    font: 700 11px var(--font); letter-spacing: 1.4px; text-transform: none; color: var(--label);
  }
  /* El conmutador Garage ↔ búsqueda medía 78x15: es el que cambia toda la lista
     de resultados y era el objetivo más pequeño de la pantalla. Mismo tratamiento
     que ya reciben `.home-nav-who .link-btn` y las acciones de tabla: el enlace
     subrayado se convierte en botón compacto con altura mínima real. */
  .rs-head .rs-toggle {
    display: inline-flex; align-items: center; min-height: 34px; margin-left: 10px;
    padding: 4px 11px; text-decoration: none; border: 1px solid var(--border);
    border-radius: var(--r-sm); color: var(--accent);
    font: 700 10px var(--font); letter-spacing: 1.1px; text-transform: none;
    transition: background .14s, border-color .14s;
  }
  .rs-head .rs-toggle:hover { background: var(--accent-soft-2); border-color: var(--accent-dim); }
  .result-count { color: var(--text-alt); font: 600 10.5px var(--font); letter-spacing: 1px; text-transform: none; }
  .result-count b { color: var(--accent); }
  .legend-est { cursor: help; }
  .link-btn {
    background: none; border: none; padding: 0; margin: 0; font: inherit; color: var(--accent);
    text-decoration: underline; cursor: pointer; touch-action: manipulation;
  }
  .legend-est .r-est { margin-left: 0; margin-right: 2px; }
  .result-row { display: flex; align-items: stretch; gap: 8px; }
  .result-list {
    /* `flex: 1` y no el `0 1 auto` de serie: con resultados la lista rebosa y
       llenaba la fila por accidente, pero con el estado vacío como único hijo
       se encogía a su contenido (436 px medidos de 900) y el "Sin resultados
       con esos filtros" salía a la izquierda en vez de centrado. */
    flex: 1; min-width: 0;
    display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; margin-bottom: -6px;
    /* las flechas ya cubren la navegación; ocultar la barra nativa deja el panel más limpio */
    scrollbar-width: none; -ms-overflow-style: none; overscroll-behavior: contain;
    /* fade de borde: oculta/descubre entrada según si hay más contenido */
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 24px, #000 calc(100% - 24px), transparent 100%);
    mask-image: linear-gradient(90deg, transparent 0, #000 24px, #000 calc(100% - 24px), transparent 100%);
  }
  .result-list::-webkit-scrollbar { display: none; }
  .rl-nav {
    flex: none; width: 34px; align-self: center; cursor: pointer; touch-action: manipulation;
    background: var(--panel); border: 1px solid var(--border-hi); border-radius: var(--r-sm);
    color: var(--text); padding: 10px 0; display: flex; align-items: center; justify-content: center;
    transition: background .15s, color .15s, border-color .15s;
  }
  .rl-nav:hover { background: var(--accent-soft-2); color: var(--accent); border-color: var(--accent-dim); }
  .result-item {
    flex: none; width: clamp(150px, 46vw, 190px); display: flex; flex-direction: column; gap: 5px; touch-action: manipulation;
    background: var(--panel); border: 1px solid var(--border); border-top: 3px solid transparent;
    border-radius: var(--r-lg); padding: 11px 13px; cursor: pointer;
    transition: border-color .15s, background .15s, transform .15s, box-shadow .15s;
    /* es un <button> (navegable con teclado): resetear estilos de botón */
    font: inherit; color: inherit; text-align: left; appearance: none;
  }
  /* Elevación al pasar: confirma que la tarjeta es pulsable antes de tocarla.
     Solo con puntero fino — en táctil no hay hover y el "sticky hover" de los
     móviles dejaría una tarjeta levantada después de tocarla. */
  @media (hover: hover) and (pointer: fine) {
    .result-item:hover {
      background: var(--panel2); border-color: var(--border-hi);
      transform: translateY(-2px); box-shadow: 0 4px 12px var(--sunken);
    }
  }
  .result-item:active { transform: translateY(0); }
  .result-item:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .r-est {
    font: 700 9px var(--font); font-style: normal; letter-spacing: 1px; color: var(--amber);
    border: 1px solid var(--amber-dim); border-radius: var(--r-sm); padding: 0 4px; margin-left: 5px; vertical-align: 1px;
    cursor: help;
  }
  .result-item.active { border-top-color: var(--accent); background: var(--accent-soft); border-color: var(--accent-dim); }
  .result-item .r-name { font: 600 12.5px var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .result-item .r-meta {
    display: flex; flex-direction: column; gap: 3px;
    color: var(--text-alt); font: 500 10.5px var(--font);
  }
  .result-item .r-psi { color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; }

  .preview-inner {
    padding: 28px 30px 60px; max-width: 1400px; margin: 0 auto;
  }
  /* pantallas ultra-anchas: limitar el ancho de lectura en vez de estirar el contenido borde a borde */
  @media (min-width: 1900px) {
    .results-strip .rs-head, .result-row { max-width: 1400px; margin-left: auto; margin-right: auto; }
  }
  @media (max-width: 1240px) {
    .search-pane { width: 380px; }
    .search-pane .filters { grid-template-columns: 1fr; }
  }
  @media (max-width: 900px) {
    .app-shell { flex-direction: column; }
    /* En columna el scroll lo maneja la página completa. Hay que soltar las TRES
       propiedades que lo atan al viewport: `height` sola no basta, porque
       `max-height: 100dvh` seguía recortando la caja y `overflow-y: auto` la
       convertía en un scroll anidado. Medido en 390x844: 1263px de contenido en
       843px de caja, con 420px atrapados y el pie —donde va el correo de
       contacto— 147px por debajo del corte. Ese era el fallo que el
       `padding-bottom` del pie intentaba tapar sin conseguirlo. */
    .search-pane {
      width: 100%; height: auto; max-height: none; overflow-y: visible;
      position: relative; border-right: 0; border-bottom: 1px solid var(--border);
    }
    /* ── Menos scroll antes del primer resultado ──────────────────────
       Medido a 390x780 había 1.140 px del borde al primer vehículo, y a esta
       pantalla se llega a mirar un dato. Se recorta sin quitar contenido:
       logotipo más pequeño, filtros a dos columnas (la regla de 1.240 px los
       apila porque allí el panel mide 380; en el celular ocupa los 390
       enteros), y los dos botones de navegación compartiendo fila en vez de
       ser dos barras a todo lo ancho. El pie ya no está aquí: se renderiza al
       final de la página (ver `esMovil` en app.js). */
    .search-pane .logo-block { margin-bottom: 14px; }
    .search-pane .logo-block .logo-img { height: 46px; }
    .search-pane .filters { grid-template-columns: 1fr 1fr; gap: 14px 12px; }
    .search-pane .filters button { padding: 12px 10px; }
    /* 1.º "Limpiar filtros" a todo lo ancho; 2.º y 3.º —Calculadoras y
       Herramientas— comparten la fila de abajo. */
    .search-pane .filters button:nth-of-type(2),
    .search-pane .filters button:nth-of-type(3) {
      grid-column: auto; font-size: 12px; padding: 12px 8px; margin-top: 4px !important;
    }

    /* El pie, ya fuera del panel, cierra la página a todo lo ancho */
    .app-shell > .app-footer {
      order: 99; width: 100%; margin-top: 0;
      padding: 18px clamp(14px, 5vw, 24px) calc(28px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--border); background: var(--bg-glass);
    }
    .content-pane { overflow-y: visible; }
    .results-strip { position: relative; }
    .preview-inner { padding: 20px 18px calc(50px + env(safe-area-inset-bottom)); }
    .results-strip .rs-head { flex-wrap: wrap; gap: 6px 10px; }
    .kv { grid-template-columns: 1fr; }
    .kv dt { margin-top: 4px; }
    .kv-sub { margin-top: 10px; }
  }
  /* táctil (dedo, no mouse): objetivos más grandes para cumplir Fitts's Law */
  @media (pointer: coarse) {
    .rl-nav { width: 44px; padding: 13px 0; }
    .result-list { scroll-snap-type: x proximity; }
    .result-item { scroll-snap-align: start; }
  }
  @media print {
    body::before, body::after, .skip-link, .search-pane, .v3d-btn, .rl-nav, .app-footer { display: none !important; }
    .app-shell { display: block; }
    .content-pane { overflow: visible; }
    .results-strip { position: static; }
    .preview-inner { padding: 0; max-width: none; }
    .v3d { display: none; } /* el canvas WebGL no imprime de forma útil */
    body { background: #fff; color: #111; }
  }

  /* ---------- paneles ---------- */
  /* Sin box-shadow: `clip-path` recorta todo lo que sale de la caja, así que la
     sombra que había aquí no se pintaba en ningún navegador — era peso muerto
     que además contradecía la regla escrita en DESIGN.md. Cuando un elemento
     biselado necesita sombra de verdad, se usa `filter: drop-shadow()`, que se
     aplica DESPUÉS del recorte y sí sigue la silueta (ver .privacy-notice). */
  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--r-lg);
    padding: clamp(14px, 3.5vw, 22px) clamp(12px, 4vw, 24px); backdrop-filter: blur(6px);
    position: relative;
  }
  .panel h2 {
    font: 600 13px var(--font); letter-spacing: .2px; text-transform: none; color: var(--label);
    display: flex; align-items: center; gap: 8px; margin-bottom: 14px;
  }

  /* ---------- buscador ---------- */
  .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)) auto; gap: 16px; align-items: end; }
  .filters label {
    display: flex; align-items: center; gap: 5px; font: 600 10px var(--font); letter-spacing: .4px; text-transform: none;
    color: var(--muted); margin-bottom: 6px;
  }
  .filters select, .filters input {
    width: 100%; background: var(--input-bg); color: var(--text); font: 500 14px var(--font);
    border: 1px solid var(--border); border-radius: var(--r-sm); padding: 10px 12px; outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .filters input::placeholder { font-size: 12.5px; letter-spacing: .1px; color: var(--muted); opacity: .85; }
  .filters select:focus-visible, .filters input:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft-2); }
  /* Secundario a propósito: la búsqueda ya es reactiva, este botón solo limpia
     — no debe competir por atención con el contenido de la ficha */
  .filters button {
    font: 600 12px var(--font); letter-spacing: .3px; text-transform: none;
    background: var(--panel2); color: var(--text); touch-action: manipulation;
    border: 1px solid var(--border-hi); border-radius: var(--r-sm); padding: 11px 28px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: color .15s, border-color .15s, background .15s;
  }
  .filters button:hover { color: var(--accent); border-color: var(--accent-dim); background: var(--accent-soft); }
  .filters button:active { transform: translateY(1px); }

  /* ---------- inputs genéricos (calculadoras) ---------- */
  .styled-input {
    width: 100%; background: var(--input-bg); color: var(--text); font: 500 14px var(--font);
    border: 1px solid var(--border); border-radius: var(--r-sm); padding: 10px 12px; outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .styled-input:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft-2); }
  .styled-input::placeholder { color: var(--muted); opacity: .7; }

  /* ---------- Herramientas del Taller ---------- */
  .tools-wrap { max-width: 900px; margin: 0 auto; }
  .tool-tabs {
    display: flex; flex-wrap: wrap; gap: 2px; border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  .tool-tab {
    flex: 1; min-width: 120px; padding: 13px 10px; cursor: pointer; touch-action: manipulation;
    display: flex; align-items: center; justify-content: center; gap: 7px;
    background: transparent; border: none; border-bottom: 2px solid transparent;
    color: var(--muted); font: 700 10.5px var(--font); letter-spacing: 1px; text-transform: none;
    transition: color .15s, border-color .15s, background .15s;
  }
  .tool-tab:hover { color: var(--text); }
  .tool-tab[data-active="true"] { color: var(--accent); border-bottom-color: var(--accent); background: var(--accent-soft); }
  .tool-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  /* diagnóstico */
  .tool-diag-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .tool-diag-btn {
    display: flex; flex-direction: column; align-items: center; gap: 9px; padding: 18px 12px;
    background: var(--panel2); border: 1px solid var(--border); border-radius: var(--r-lg); cursor: pointer; touch-action: manipulation;
    color: var(--text); font: 600 12px var(--font); text-align: center; transition: border-color .15s, background .15s, transform .15s;
  }
  .tool-diag-btn:hover { border-color: var(--accent-dim); background: var(--accent-soft); color: var(--accent); }
  .tool-diag-btn:active { transform: translateY(1px); }
  .tool-diag { margin-top: 16px; }
  .tool-diag-head { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-bottom: 12px; font: 700 14px var(--font); color: var(--text); }
  .tool-diag-head .link-btn { margin-left: auto; font-size: 11px; }
  .tool-diag-step { display: flex; gap: 12px; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--r-lg); margin-bottom: 8px; background: var(--panel); }
  .tool-diag-num {
    flex: none; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: var(--accent-fill); color: var(--accent-ink); font: 800 12px var(--font);
  }
  .tool-diag-causa { font: 700 13px var(--font); color: var(--text); }
  .tool-diag-prueba { font: 500 12.5px var(--font); color: var(--text-alt); margin-top: 3px; line-height: 1.5; }

  /* checklist */
  .tool-check-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; font: 700 13.5px var(--font); }
  .tool-progress { height: 5px; background: var(--neutral-soft-2); border-radius: var(--r-full); overflow: hidden; margin-bottom: 14px; }
  .tool-progress div { height: 100%; background: linear-gradient(90deg, var(--accent-fill-strong), var(--accent-fill)); transition: width .25s; }
  .tool-check-list { display: flex; flex-direction: column; gap: 6px; }
  .tool-check-item {
    display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; cursor: pointer;
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--r-lg);
    font: 500 13px var(--font); color: var(--text); transition: background .15s, border-color .15s, opacity .15s;
  }
  /* La casilla real se oculta y el cuadrito visible es `.tool-check-box`. Con
     `opacity: 0` el contorno de foco del navegador también se vuelve invisible,
     así que quien navega con teclado no veía DÓNDE estaba parado: la hoja no
     tenía ni una sola regla de :focus-within. El foco se traslada al cuadrito. */
  .tool-check-item input { position: absolute; opacity: 0; pointer-events: none; }
  .tool-check-item:focus-within { border-color: var(--accent-dim); }
  .tool-check-item:has(input:focus-visible) .tool-check-box,
  .tool-check-item:focus-within .tool-check-box {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .tool-check-box {
    flex: none; width: 19px; height: 19px; margin-top: 1px; border-radius: var(--r-sm);
    border: 1.5px solid var(--border-hi); display: flex; align-items: center; justify-content: center;
    color: transparent; transition: background .15s, border-color .15s, color .15s;
  }
  .tool-check-item[data-checked="true"] { background: var(--accent-soft); border-color: var(--accent-dim); }
  .tool-check-item[data-checked="true"] .tool-check-box { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--accent-ink); }
  .tool-check-item[data-checked="true"] > span:last-child { opacity: .65; text-decoration: line-through; }
  .tool-check-item:hover { border-color: var(--border-hi); }

  /* ---- checklist editable: paso + lápiz + papelera ---- */
  .tool-check-row { display: flex; align-items: flex-start; gap: 6px; }
  .tool-check-row > .tool-check-item, .tool-check-row > .tool-check-edit { flex: 1; min-width: 0; }
  .tool-check-edit { padding: 10px 12px; font-size: 13px; }
  .tool-icon-btn {
    flex: none; width: 34px; height: 34px; margin-top: 4px; padding: 0; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; border: 1px solid var(--border); border-radius: var(--r-sm);
    color: var(--muted); touch-action: manipulation;
    transition: color .15s, background .15s, border-color .15s;
  }
  .tool-icon-btn:hover { color: var(--accent); border-color: var(--accent-dim); background: var(--accent-soft); }
  .tool-icon-btn.danger:hover { color: var(--danger); border-color: var(--danger-dim); background: var(--danger-soft); }
  .tool-icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tool-check-add { display: flex; gap: 8px; align-items: stretch; margin-top: 12px; flex-wrap: wrap; }
  .tool-check-add input { flex: 1; min-width: 180px; }
  .tool-check-add .tool-add-btn { flex: none; }
  @media (pointer: coarse) { .tool-icon-btn { width: 44px; height: 44px; } }

  /* comparador */
  .cmp-selects { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px; }
  @media (max-width: 600px) { .cmp-selects { grid-template-columns: 1fr; } }
  .cmp-table { border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; }
  .cmp-head, .cmp-row { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 10px; padding: 10px 14px; align-items: center; }
  .cmp-head { background: var(--panel2); font: 700 11px var(--font); letter-spacing: 1px; text-transform: none; color: var(--muted); }
  .cmp-head .cmp-a, .cmp-head .cmp-b { color: var(--label); }
  .cmp-row { border-top: 1px solid var(--border); font: 500 12.5px var(--font); }
  .cmp-lbl { color: var(--muted); font-size: 11.5px; }
  .cmp-a, .cmp-b { font-variant-numeric: tabular-nums; }
  .cmp-ok { color: var(--accent); font-weight: 800; }
  .cmp-warn { color: var(--amber); font-weight: 800; }

  /* glosario */
  .tool-gloss { margin-top: 14px; display: flex; flex-direction: column; gap: 0; }
  .tool-gloss-item { display: grid; grid-template-columns: 140px 1fr; gap: 14px; padding: 11px 4px; border-bottom: 1px solid var(--border); }
  .tool-gloss-item strong { color: var(--text); font: 600 12.5px var(--font); letter-spacing: .2px; }
  .tool-gloss-item span { color: var(--text-alt); font: 500 12.5px var(--font); line-height: 1.5; }
  @media (max-width: 600px) { .tool-gloss-item { grid-template-columns: 1fr; gap: 3px; } }

  /* registro de trabajos */
  .tool-add-btn {
    flex: none; display: inline-flex; align-items: center; gap: 7px; cursor: pointer; touch-action: manipulation;
    background: var(--accent-fill); color: var(--accent-ink); border: 1px solid var(--accent-fill);
    font: 700 11px var(--font); letter-spacing: 1px; text-transform: none;
    padding: 11px 18px; border-radius: var(--r-sm); transition: filter .15s, opacity .15s;
  }
  .tool-add-btn:hover:not(:disabled) { filter: brightness(1.1); }
  /* Deshabilitado por color, no por opacidad. Con `opacity: .4` la tinta oscura
     y el relleno lima se fundían entre sí y la etiqueta caía a 2.35:1: se veía
     un botón, pero no se podía leer QUÉ botón. WCAG exime los controles
     inactivos, pero aquí la etiqueta dice cosas como "Enviar por WhatsApp" y el
     mecánico necesita saber qué le está pidiendo la app antes de habilitarlo.
     Gris sólido sobre relleno neutro: inequívocamente inactivo y legible (5.3:1). */
  .tool-add-btn:disabled {
    opacity: 1; cursor: default; filter: none;
    background: var(--neutral-soft-3); border-color: var(--border); color: var(--muted);
  }
  .tool-jobs { display: flex; flex-direction: column; gap: 8px; }
  /* Las tres celdas a mano: con colocación automática la papelera —que cruza
     las dos filas— no cabía en la fila 1 (texto y fecha ya la ocupaban) y
     acababa a la IZQUIERDA, con el registro corrido a la derecha. */
  .tool-job {
    padding: 12px 14px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--r-lg);
    display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 10px;
  }
  .tool-job-t { grid-column: 1; grid-row: 1; font: 600 13px var(--font); color: var(--text); }
  .tool-job-meta {
    grid-column: 1; grid-row: 2;
    font: 500 11px var(--font); color: var(--muted); margin-top: 4px; display: flex; gap: 10px; align-items: center;
  }
  .tool-job > .tool-icon-btn { grid-column: 2; grid-row: 1 / span 2; margin-top: 0; align-self: center; }

  .badge {
    font: 600 10.5px var(--font); letter-spacing: 1.2px; text-transform: none;
    padding: 4px 10px; border-radius: var(--r-sm); border: 1px solid; white-space: nowrap;
  }
  .badge.MFI  { color: var(--text); border-color: var(--border-hi); background: var(--neutral-soft-2); }
  .badge.TBI, .badge.VORTEC_CSFI, .badge.GDI {
    color: var(--accent); border-color: var(--accent-dim); background: var(--accent-soft);
  }
  /* ámbar, no rojo: "no verificado" es una advertencia de dato, no una alerta del sistema de inyección */
  .badge.unverified { color: var(--amber); border-color: var(--amber-dim); background: var(--amber-soft); }

  /* ---------- detalle (vista en vivo) ---------- */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }

  .vh-head { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; }
  .vh-head h2 { font: 800 clamp(18px, 5vw, 22px) var(--font); letter-spacing: .5px; text-wrap: balance; }
  .bignum { font: 800 clamp(23px, 7vw, 30px) var(--font); color: var(--text); margin-top: 8px; font-variant-numeric: tabular-nums; }
  .bignum small { font: 400 12.5px var(--font); color: var(--muted); letter-spacing: 0; }

  .kv { display: grid; grid-template-columns: minmax(110px, 165px) 1fr; gap: 5px 12px; font-size: 13.5px; margin-top: 10px; }
  .kv dt { color: var(--muted); }
  .kv dd { font-weight: 500; font-variant-numeric: tabular-nums; }
  .kv .psi { color: var(--text); font-family: var(--font); font-weight: 700; }
  .kv-sub {
    grid-column: 1 / -1; font: 600 9.5px var(--font); letter-spacing: .4px; text-transform: none;
    color: var(--muted); margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border);
  }
  .kv-sub:first-child { margin-top: 0; padding-top: 0; border-top: 0; }

  /* ámbar, no lima: una advertencia no puede compartir color con el acento de marca,
     que en el resto de la interfaz significa "correcto / dato principal" */
  .alert {
    border-left: 3px solid var(--amber); background: var(--amber-soft); display: flex; align-items: flex-start; gap: 8px;
    padding: 10px 14px; font-size: 13px; margin-top: 12px; color: var(--alert-text);
  }
  .alert.blue { border-left-color: var(--border-hi); background: var(--neutral-soft-2); color: var(--text); }
  .alert .icon { margin-top: 1px; }

  /* indicador de bajar tanque: es el primer dato que necesita el mecánico, vive arriba del panel */
  .tank-flag {
    display: inline-flex; align-items: center; gap: 7px; font: 700 12px var(--font);
    letter-spacing: 1px; text-transform: none; padding: 6px 12px; border-radius: var(--r-sm);
    border: 1px solid; margin-bottom: 14px;
  }
  /* bajar el tanque es trabajo extra (ámbar) y no bajarlo es la buena noticia (lima):
     invertir esto haría que el acento de marca señalara el caso más costoso */
  .tank-flag.drop { color: var(--amber); border-color: var(--amber-dim); background: var(--amber-soft); }
  .tank-flag.nodrop { color: var(--accent); border-color: var(--accent-dim); background: var(--accent-soft); }

  /* ---------- visores 3D ---------- */
  .v3d {
    background: var(--v3d-bg);
    border: 1px solid var(--border); margin-top: 6px; overflow: hidden; position: relative;
  }
  .v3d canvas { display: block; }
  .v3d-hint {
    position: absolute; right: 10px; bottom: 8px; font: 500 10px var(--font);
    letter-spacing: 1.2px; text-transform: none; color: var(--v3d-hint); pointer-events: none;
  }
  .v3d-tip {
    position: absolute; left: 0; top: 0; opacity: 0; pointer-events: none; z-index: 3;
    background: var(--bg-glass-tip); border: 1px solid var(--accent); color: var(--accent);
    font: 600 11.5px var(--font); letter-spacing: .8px; padding: 5px 10px; white-space: nowrap;
    transition: opacity .12s;
  }
  .v3d-btn {
    position: absolute; left: 10px; top: 10px; z-index: 3; cursor: pointer; touch-action: manipulation;
    font: 500 12px var(--font); letter-spacing: 0; display: flex; align-items: center; gap: 7px;
    background: var(--accent-fill); color: var(--accent-ink); border: 1px solid var(--accent-fill);
    padding: 8px 16px; border-radius: var(--r-sm); transition: filter .15s;
  }
  .v3d-btn:hover { filter: brightness(1.08); }

  /* ---------- pilas ---------- */
  .pump-card { background: var(--panel2); border: 1px solid var(--border); padding: 14px 16px; }
  .pump-card h4 { font: 700 14.5px var(--font); color: var(--text); display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  .chip { font: 700 10px var(--font); letter-spacing: 1.2px; border-radius: var(--r-sm); padding: 2px 8px; border: 1px solid; }
  .chip.oem { color: var(--accent); border-color: var(--accent-dim); }
  .chip.alt { color: var(--muted); border-color: var(--border-hi); }
  .muted { color: var(--muted); font-size: 13px; }
  .empty { text-align: center; color: var(--muted); padding: 46px; font-family: var(--font); letter-spacing: 1px; }
  .mt { margin-top: 16px; }

  /* estado vacío del buscador: no debe leerse como "la app se rompió" */
  .empty-state {
    width: 100%; text-align: center; padding: 48px 28px; color: var(--text);
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  .empty-state .empty-icon {
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent);
    display: inline-flex; align-items: center; justify-content: center;
    margin-bottom: 4px;
  }
  .empty-state .empty-title {
    font: 600 16px/1.3 var(--font); color: var(--ink); margin: 0;
  }
  .empty-state p { font: 600 13.5px var(--font); margin: 0; }
  .empty-state .empty-hint {
    font: 400 13px/1.55 var(--font); color: var(--muted); max-width: 380px; margin: 0;
  }
  .empty-state .empty-action {
    margin-top: 10px; font: 600 13px var(--font);
    background: var(--accent-fill); color: var(--accent-ink);
    border: 1px solid var(--accent-fill);
    border-radius: var(--r); padding: 10px 18px; cursor: pointer;
    transition: background .15s, border-color .15s;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .empty-state .empty-action:hover { filter: brightness(1.1); }
  .empty-state p.hint { font: 500 12px var(--font); color: var(--muted); max-width: 380px; }
  .empty-state button {
    margin-top: 6px; font: 700 11px var(--font); letter-spacing: 1.5px; text-transform: none;
    background: transparent; color: var(--accent); border: 1px solid var(--accent-dim); touch-action: manipulation;
    border-radius: var(--r-sm); padding: 9px 22px; cursor: pointer; transition: background .15s;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .empty-state .icon { color: var(--muted); }
  .empty-state button:hover { background: var(--accent-soft-2); }

  /* ---------- pantallas de error (lib/errores.js) ----------
     Las cinco láminas son lápiz sobre papel crema y en tema oscuro NO se
     invierten: eso las deja en negativo, que es justo el fallo corregido en la
     sección del taller. La ilustración se queda igual y cambia el resto. */
  .err-pantalla {
    min-height: 72vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: clamp(18px, 4vw, 36px);
    padding: clamp(28px, 6vw, 64px) clamp(18px, 5vw, 40px);
  }
  /* La marca arriba: sin ella una pantalla de error se lee como página de
     nadie, que es lo que pasaba con el 404 por defecto de Express. */
  .err-marca { width: 100%; max-width: 1040px; display: flex; }
  .err-marca img { height: var(--logo-h-m); width: auto; }
  .err-caja {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: clamp(20px, 5vw, 56px); align-items: center;
    max-width: 1040px; width: 100%;
  }
  .err-ilustracion {
    width: 100%; height: auto; border-radius: var(--r-lg);
    background: #F8F1EA;   /* el papel de la lámina, para el borde del recorte */
  }
  .err-texto { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
  /* El número, grande y en segundo plano: se reconoce de un vistazo sin
     competir con el titular, que es lo que dice qué pasó. */
  .err-codigo {
    font: 800 clamp(52px, 9vw, 86px)/1 var(--font); letter-spacing: -.03em;
    color: var(--accent); opacity: .28; margin: 0 0 -6px;
  }
  /* Sobre el lienzo oscuro el verde a .28 casi desaparece: el número es la
     señal que se busca de un vistazo, así que se sube. */
  :root[data-theme="dark"] .err-codigo { opacity: .42; }
  .err-titulo { font: 700 clamp(22px, 3vw, 32px)/1.15 var(--font); letter-spacing: -.02em; color: var(--ink); margin: 0; }
  .err-lema { font: 600 15px/1.4 var(--font); color: var(--accent); margin: 0; }
  .err-detalle { font: 400 15px/1.6 var(--font); color: var(--ink-2); margin: 0; max-width: 46ch; }
  .err-ayuda { font: 400 13.5px/1.6 var(--font); color: var(--muted); margin: 4px 0 0; max-width: 48ch; }
  .err-ruta { font: 400 12.5px/1.5 var(--font); color: var(--muted); margin: 2px 0 0; max-width: 100%; }
  .err-ruta code, .err-incidencia code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
    background: var(--sunken); border: 1px solid var(--border); border-radius: var(--r-sm);
    padding: 2px 6px; word-break: break-all;
  }
  .err-acciones { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .err-accion {
    display: inline-flex; align-items: center; justify-content: center; min-height: 44px;
    padding: 12px 20px; border-radius: var(--r); text-decoration: none;
    font: 600 13.5px var(--font); touch-action: manipulation;
    border: 1.5px solid var(--border-hi); color: var(--ink); background: transparent;
    transition: background .15s, color .15s, border-color .15s, filter .15s;
  }
  .err-accion:hover { border-color: var(--accent-dim); color: var(--accent); background: var(--accent-soft); }
  .err-accion--principal {
    background: var(--accent-fill); border-color: var(--accent-fill); color: var(--accent-ink);
  }
  .err-accion--principal:hover { filter: brightness(1.1); background: var(--accent-fill); color: var(--accent-ink); }
  .err-incidencia { font: 400 12.5px/1.6 var(--font); color: var(--muted); margin: 12px 0 0; }
  .err-contacto { font: 400 12.5px/1.6 var(--font); color: var(--muted); margin: 2px 0 0; }
  .err-contacto a { color: var(--accent); }
  /* Celular: ilustración arriba y texto debajo, en el orden en que se lee, y
     con la lámina recortada para que el titular no caiga bajo el pliegue. */
  @media (max-width: 760px) {
    .err-caja { grid-template-columns: 1fr; gap: 18px; }
    .err-ilustracion { max-width: 340px; margin: 0 auto; }
    .err-codigo { font-size: clamp(46px, 15vw, 64px); }
    .err-accion { flex: 1 1 auto; }
  }

  /* ---------- comentarios ---------- */
  .comments-list { display: flex; flex-direction: column; gap: 12px; }
  .comment-item { padding: 12px 14px; background: var(--panel2); border: 1px solid var(--border); border-radius: var(--r-lg); }
  .comment-item.reply { margin-top: 10px; border-left: 2px solid var(--accent-dim); background: var(--sunken); }
  .comment-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; font-size: 13px; }
  .comment-body { color: var(--text); font-size: 13.5px; line-height: 1.5; word-wrap: break-word; }
  .comment-replies { margin-left: 12px; margin-top: 10px; padding-left: 12px; border-left: 1px solid var(--border); }
  .mt-small { margin-top: 8px; }

  /* ---------- footer (pie del panel de búsqueda) ---------- */
  /* El relleno inferior era de 40px "para que el correo nunca quede oculto": un
     parche contra el scroll atrapado del panel en móvil, que ya se corrige en su
     origen (ver el bloque de 900px). Aquí basta el respiro normal. */
  .app-footer {
    margin-top: 20px; padding: 16px 0 20px; border-top: 1px solid var(--border);
    color: var(--muted); font: 400 10.5px var(--font); letter-spacing: .5px;
  }
  /* Los enlaces legales del pie median 13px de alto: imposibles de acertar con el
     dedo y muy por debajo de los 44px que el resto del proyecto ya respeta. El
     relleno vertical va con margen negativo para no separar las líneas. */
  .app-footer .footer-links { display: flex; flex-wrap: wrap; align-items: center; gap: 0 4px; }
  .app-footer .footer-links a {
    display: inline-block; padding: 9px 0; margin: -5px 0;
    color: var(--muted); text-decoration: underline; text-underline-offset: 2px;
    transition: color .15s;
  }
  .app-footer .footer-links a:hover, .app-footer .footer-links a:focus-visible { color: var(--accent); }
  @media (pointer: coarse) { .app-footer .footer-links a { padding: 12px 0; } }
  .app-footer .footer-mark { height: var(--logo-h-s); width: auto; flex: none; opacity: .85; }
  .app-footer .footer-mark { color: var(--accent); }
  .app-footer .footer-head { display: flex; align-items: center; gap: 9px; margin-bottom: 6px; }
  .app-footer .footer-desc { margin-top: 2px; }
  /* Iba a 9px con opacity .65, o sea 3.5:1 en oscuro y 3.2:1 en claro: por
     debajo de AA y, sobre todo, ilegible para el público de este producto —un
     mecánico leyendo a distancia de brazo con luz de taller—. Sube a 10.5px y
     pierde la opacidad; la jerarquía la marca --muted, que ya va 4 puntos por
     debajo del texto principal. */
  .app-footer .footer-copy { margin-top: 8px; font-size: 10.5px; letter-spacing: .2px; }
  .dev-contact {
    margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border);
    display: flex; align-items: flex-start; gap: 7px;
  }
  .dev-contact .icon { margin-top: 1px; }
  .dev-contact a {
    /* min-width:0 + overflow-wrap permiten que el texto se ajuste (wrap) en vez de
       forzar overflow horizontal — el correo (un token sin espacios) desbordaba en móvil */
    min-width: 0; flex: 1; overflow-wrap: anywhere;
    color: var(--muted); text-decoration: none; font: 600 10.5px var(--font); letter-spacing: .3px;
    transition: color .15s;
    /* medía 13px de alto: relleno vertical para que se pueda tocar */
    display: inline-block; padding: 6px 0; margin: -6px 0;
  }
  @media (pointer: coarse) { .dev-contact a { padding: 10px 0; margin: -10px 0; } }
  .dev-contact a:hover, .dev-contact a:focus-visible { color: var(--accent); }

  /* ---------- Chatbot flotante ---------- */
  /* El toast y el aviso de privacidad ya respetaban env(safe-area-inset-*); este
     no, y era el único de los tres que se toca. En un iPhone con indicador de
     inicio el círculo de 52px caía sobre la franja del gesto: el sistema se queda
     el toque y el chat no abre. */
  .chat-fab {
    position: fixed; z-index: 200;
    bottom: calc(24px + env(safe-area-inset-bottom));
    right: calc(24px + env(safe-area-inset-right));
    width: 60px; height: 60px; border-radius: 50%; cursor: pointer;
    background: var(--accent-fill); color: var(--accent-ink);
    border: 2px solid var(--accent-fill);
    display: flex; align-items: center; justify-content: center;
    transition: filter .15s, transform .2s, box-shadow .2s;
    box-shadow: 0 4px 20px rgba(63, 81, 50, 0.4), 0 0 0 0 rgba(63, 81, 50, 0.3);
    animation: chat-pulse 2.5s infinite;
  }
  @keyframes chat-pulse {
    0%, 100% { box-shadow: 0 4px 20px rgba(63, 81, 50, 0.4), 0 0 0 0 rgba(63, 81, 50, 0.3); }
    50% { box-shadow: 0 4px 24px rgba(63, 81, 50, 0.5), 0 0 0 12px rgba(63, 81, 50, 0); }
  }
  .chat-fab:hover {
    filter: brightness(1.1);
    transform: scale(1.08);
    animation: none;
  }
  .chat-fab:active { filter: brightness(.95); transform: scale(.96); }
  .chat-fab-badge {
    position: absolute; top: -2px; right: -2px;
    width: 18px; height: 18px; border-radius: 50%;
    background: #22c55e; border: 2px solid var(--panel);
    display: flex; align-items: center; justify-content: center;
    font: 700 9px system-ui; color: white;
  }

  .chat-panel {
    position: fixed; z-index: 199;
    bottom: calc(96px + env(safe-area-inset-bottom));
    right: calc(24px + env(safe-area-inset-right));
    width: 400px; height: 560px; max-height: calc(100dvh - 140px);
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--r-lg);
    backdrop-filter: blur(16px); display: flex; flex-direction: column;
    box-shadow: 0 12px 48px rgba(0,0,0,0.18), 0 4px 16px rgba(0,0,0,0.1);
    animation: chat-slide .25s ease-out;
  }
  @keyframes chat-slide {
    from { opacity: 0; transform: translateY(16px) scale(.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .chat-head {
    display: flex; align-items: center; gap: 8px; padding: 14px 16px;
    border-bottom: 1px solid var(--border); flex: none;
    font: 700 12px var(--font); letter-spacing: 1.5px; text-transform: none;
    color: var(--accent);
  }
  .chat-head span { flex: 1; }
  .chat-remaining {
    flex: none; font: 700 9px var(--font); letter-spacing: 1px; color: var(--muted);
    background: var(--neutral-soft-2); border: 1px solid var(--border); border-radius: var(--r-full);
    padding: 3px 8px;
  }
  .chat-limit-bar {
    display: flex; align-items: center; gap: 7px; font: 600 11px var(--font);
    color: var(--amber); background: var(--amber-soft); border: 1px solid var(--amber-dim);
    border-radius: var(--r-sm); padding: 8px 11px; margin-bottom: 2px;
  }
  .chat-close {
    background: none; border: none; color: var(--muted); cursor: pointer; padding: 4px;
    display: flex; border-radius: var(--r-sm); transition: color .15s, background .15s;
  }
  .chat-close:hover { color: var(--text); background: var(--neutral-soft-3); }
  .chat-body {
    flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px;
    scrollbar-width: thin; scrollbar-color: var(--scroll-thumb) transparent;
  }
  .chat-body::-webkit-scrollbar { width: 4px; }
  .chat-body::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: var(--r-sm); }
  .chat-empty {
    text-align: center; color: var(--muted); padding: 20px 10px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .chat-empty-logo { height: 30px; width: auto; opacity: .9; }
  .chat-empty p { font: 500 12px var(--font); max-width: 280px; }
  .chat-suggestions {
    display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 280px;
  }
  .chat-suggestions button {
    font: 600 10.5px var(--font); letter-spacing: .3px;
    background: var(--panel2); border: 1px solid var(--border); border-radius: var(--r-sm);
    color: var(--text); padding: 8px 14px; cursor: pointer; text-align: left;
    transition: border-color .15s, background .15s;
  }
  .chat-suggestions button:hover { border-color: var(--accent-dim); background: var(--accent-soft); color: var(--accent); }
  .chat-warn { color: var(--amber); font-size: 10.5px !important; }
  .chat-msg { display: flex; gap: 8px; max-width: 100%; }
  .chat-msg.user { justify-content: flex-end; }
  .chat-msg.bot { justify-content: flex-start; }
  .chat-avatar {
    flex: none; width: 26px; height: 26px; border-radius: 50%; margin-top: 2px;
    background: var(--accent-soft-2); border: 1px solid var(--accent-dim);
    display: flex; align-items: center; justify-content: center; color: var(--accent);
  }
  .chat-avatar .chat-avatar-mark { height: 13px; width: auto; }
  .chat-avatar .chat-avatar-mark { color: var(--accent-ink); }
  .chat-bubble {
    max-width: 85%; padding: 9px 13px; border-radius: var(--r);
    font: 500 13px/1.45 var(--font); overflow-wrap: anywhere;
    word-break: break-word;
  }
  .chat-msg.user .chat-bubble {
    background: var(--accent-soft-2); border: 1px solid var(--accent-dim);
    color: var(--text);
  }
  .chat-msg.bot .chat-bubble {
    background: var(--panel2); border: 1px solid var(--border);
    color: var(--text);
  }
  .chat-bubble.thinking { min-width: 48px; display: flex; align-items: center; justify-content: center; }
  /* Tres puntos, dos fallos que se arreglan juntos:
     1. Los pseudoelementos eran `inline-block` dentro de una caja de 6px, así
        que se desbordaban y se montaban sobre el punto del padre (scrollWidth
        14 sobre un ancho de 6). No se leía como tres puntos sino como un borrón.
        Ahora van `absolute` y el padre reserva su hueco con el margen lateral.
     2. Los tres compartían animación SIN retardo: parpadeaban a la vez, que es
        un destello y no la onda de "escribiendo". El escalonado 0 / .16 / .32
        recorre los puntos de izquierda a derecha. */
  .dot-pulse {
    position: relative; display: inline-block; width: 6px; height: 6px;
    border-radius: 50%; background: var(--muted); margin: 0 10px;
    animation: dot-pulse 1.2s ease-in-out infinite .16s;
  }
  .dot-pulse::before, .dot-pulse::after {
    content: ''; position: absolute; top: 0; width: 6px; height: 6px;
    border-radius: 50%; background: var(--muted);
    animation: dot-pulse 1.2s ease-in-out infinite;
  }
  .dot-pulse::before { right: 10px; }
  .dot-pulse::after { left: 10px; animation-delay: .32s; }
  @keyframes dot-pulse {
    0%, 80%, 100% { opacity: .3; }
    40% { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .dot-pulse, .dot-pulse::before, .dot-pulse::after { animation: none; opacity: .55; }
  }
  .chat-foot {
    display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border);
    flex: none;
  }
  .chat-input {
    flex: 1; background: var(--input-bg); border: 1px solid var(--border);
    border-radius: var(--r-sm); padding: 10px 13px; font: 500 13px var(--font);
    color: var(--text); outline: none; transition: border-color .2s;
  }
  .chat-input:focus { border-color: var(--accent); }
  .chat-input::placeholder { color: var(--muted); opacity: .7; }
  .chat-input:disabled { opacity: .5; }
  .chat-send {
    flex: none; width: 38px; border-radius: var(--r-sm); cursor: pointer;
    background: var(--accent-fill); border: 1px solid var(--accent-fill); color: var(--accent-ink);
    display: flex; align-items: center; justify-content: center;
    transition: filter .15s, opacity .15s;
  }
  .chat-send:hover:not(:disabled) { filter: brightness(1.12); }
  .chat-send:disabled { opacity: .35; cursor: default; }

  @media (max-width: 480px) {
    .chat-panel {
      width: calc(100vw - 32px); right: 16px;
      bottom: calc(80px + env(safe-area-inset-bottom));
      /* 100dvh, no 100vh: con la barra del navegador desplegada el panel medía
         más que la pantalla real y el campo de escribir quedaba fuera. */
      height: calc(100dvh - 160px); max-height: none;
    }
    .chat-fab {
      right: calc(16px + env(safe-area-inset-right));
      bottom: calc(16px + env(safe-area-inset-bottom));
    }
  }

  /* ================================================================
     DASHBOARD DE MICRO APPS (home) — menú superior + página explicativa
     ================================================================ */
  .home {
    position: relative; min-height: 100vh;
    background: var(--bg);
  }
  .home > * { position: relative; z-index: 1; }

  /* ---- barra de menú superior ---- */
  .home-nav {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; gap: 14px;
    /* El logotipo tiene que caer en el MISMO eje que el titular del hero y que
       el logotipo del pie. Los tres bloques centran su contenido en 1280 px,
       pero la barra iba a un relleno fijo de 22 px, así que arrancaba 58 px
       antes que todo lo demás y la página se leía descuadrada de arriba abajo.
       El `max()` mantiene los 22 px como mínimo en pantallas estrechas. */
    padding: 15px max(clamp(20px, 5vw, 40px), calc((100% - 1280px) / 2));
    background: var(--bg-glass); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .home-nav-logo { display: flex; align-items: center; gap: 0; color: var(--accent); }
  .home-nav-logo img { height: var(--logo-h-m); width: auto; }
  /* NUNCA envuelve: con la marca, seis categorías, el buscador y la cuenta en
     la misma barra, por debajo de ~1400 px los enlaces se iban a una segunda
     fila y la barra pasaba de 79 a 125 px, con el logotipo flotando a media
     altura de un bloque de dos pisos. Si no caben, se deslizan. */
  .home-nav-links {
    display: flex; align-items: center; gap: 4px; margin: 0 auto;
    flex-wrap: nowrap; overflow-x: auto; overscroll-behavior-x: contain;
    scrollbar-width: none; -ms-overflow-style: none;
    /* el degradado del borde avisa de que queda menú por ver */
    -webkit-mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 16px), transparent 100%);
    mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 16px), transparent 100%);
  }
  .home-nav-links::-webkit-scrollbar { display: none; }
  .home-nav-link { flex: none; }
  .home-nav-link {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer; touch-action: manipulation;
    background: none; border: 1px solid transparent; border-radius: var(--r); color: var(--muted);
    font: 500 13px var(--font); letter-spacing: 0; padding: 8px 13px;
    transition: background .15s, color .15s, border-color .15s;
  }
  .home-nav-link:hover { background: var(--panel2); color: var(--text); }
  .home-nav-link.active { background: var(--accent-soft-2); color: var(--accent); border-color: var(--accent-dim); }
  .home-nav-ic { display: inline-flex; }
  .home-nav-user { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
  /* Selector de tema en la barra: el margen inferior de 26px que trae de serie
     era para el panel de filtros; aquí lo alinea el flex. */
  .home-nav .theme-switch { margin: 0; padding: 2px; flex: none; }
  /* Sol y luna, sin etiqueta. El icono ya dice de qué va el control —es el
     patrón que todo el mundo reconoce— y con el texto puesto la barra no cabe:
     lleva marca, seis categorías, buscador y cuenta, y a 1440 px cortaba tanto
     "Aprender" como "Iniciar sesión". El `title` y el `aria-label` de cada
     botón, más el `aria-pressed` que marca cuál está activo, lo dejan claro
     para el lector de pantalla y al pasar el ratón. */
  .home-nav .theme-switch button { padding: 9px 12px; }
  /* `:not(.icon)` no es un detalle: el icono TAMBIÉN es un <span> —así lo monta
     el componente Icon, que le mete el SVG dentro— así que un `span { display:
     none }` a secas escondía el sol y la luna junto con la etiqueta y dejaba el
     control como una píldora vacía de 52x24 px. */
  .home-nav .theme-switch button span:not(.icon) { display: none; }
  .home-nav-who { display: inline-flex; align-items: center; gap: 8px; font: 600 11px var(--font); color: var(--muted); }
  .home-nav-who-name { max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* El nombre del taller es ahora la puerta a «Mi taller» (ver/editar cuenta).
     Antes era un <span> informativo; al volverse botón necesita su propio
     estilo: área táctil mínima, hover y foco visible como los demás controles
     de la barra, y el chevron que anuncia que despliega una pantalla. */
  .home-nav-who-btn {
    display: inline-flex; align-items: center; gap: 4px;
    max-width: 170px; min-height: 36px; padding: 0 6px 0 10px;
    background: transparent; border: 1px solid transparent; border-radius: var(--r-sm);
    color: var(--ink); font: 600 12px var(--font); letter-spacing: 0; text-transform: none;
    cursor: pointer; touch-action: manipulation;
    transition: border-color .15s, background .15s, color .15s;
  }
  .home-nav-who-btn:hover { border-color: var(--border-hi); background: var(--panel2); color: var(--accent); }
  .home-nav-who-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .home-nav-who-btn:active { transform: translateY(1px); }
  .home-nav-who-btn svg { flex: none; color: var(--muted); }
  /* Botón dedicado de cerrar sesión. Antes era un link-btn minúsculo pegado
     al nombre del taller: se deformaba en cualquier resize y el área tocable
     quedaba bajo 30 px. Ahora es un botón con icono, separador visual y foco
     visible: área de toque ≥ 36 px y borde claro al tabular. */
  .home-nav-who-divider { width: 1px; height: 16px; background: var(--border); }
  .home-nav-logout {
    display: inline-flex; align-items: center; gap: 6px;
    min-height: 36px; padding: 0 12px;
    background: transparent; border: 1px solid var(--border); border-radius: var(--r-sm);
    color: var(--muted); font: 500 12px var(--font); letter-spacing: 0; text-transform: none;
    cursor: pointer; touch-action: manipulation;
    transition: color .15s, border-color .15s, background .15s;
  }
  .home-nav-logout:hover { color: var(--accent); border-color: var(--accent-dim); background: var(--accent-soft); }
  .home-nav-logout:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .home-nav-logout:active { transform: translateY(1px); }
  .home-nav-logout-label { display: inline; }
  .home-nav-login {
    display: inline-flex; align-items: center; cursor: pointer; touch-action: manipulation;
    padding: 9px 15px; border-radius: var(--r-sm);
    background: var(--accent-fill); border: 1px solid var(--accent-fill); color: var(--accent-ink);
    font: 500 13px var(--font); letter-spacing: 0; text-transform: none;
    transition: filter .15s;
  }
  .home-nav-login:hover { filter: brightness(1.1); }

  /* ---- cuerpo ---- */
  .home-body { max-width: 1200px; margin: 0 auto; padding: clamp(36px, 5vw, 60px) clamp(18px, 3vw, 24px) 88px; }

  /* Objetivos táctiles: en pantalla táctil (pointer: coarse) los controles
     compactos suben a 44px, el mínimo cómodo con el dedo. En ratón se quedan
     compactos para no inflar las tablas densas de la ficha. */
  @media (pointer: coarse) {
    .quote-del, .theme-switch button { min-height: 44px; }
    .quote-del { width: 44px; }
    .home-footer a, .home-footer .link-btn { padding: 12px 0; }
  }

  /* Los selectores de fecha nativos heredan el esquema del documento; sin esto
     el icono del calendario queda negro sobre el input casi negro. */
  .styled-input[type="date"], .styled-input[type="datetime-local"], .styled-input[type="time"] { color-scheme: inherit; }
  :root[data-theme="dark"] .styled-input[type="datetime-local"]::-webkit-calendar-picker-indicator { filter: invert(1) opacity(.7); }
  :root[data-theme="light"] .styled-input[type="datetime-local"]::-webkit-calendar-picker-indicator { filter: none; }

  /* Titulares: evita la última línea huérfana de una sola palabra */
  h1, h2, h3, .micro-card-title { text-wrap: balance; }

  /* ================================================================
     HERO "TODO LO QUE NECESITAS" (pestaña inicio)
     ----------------------------------------------------------------
     Layout 2 columnas con tipografía grande a la izquierda y una
     foto del mecánico recortada con la silueta de la llave a la
     derecha. Badges de confianza debajo del CTA y un card flotante
     "Herramientas Pro / Catálogo actualizado" sobre la imagen.
     ================================================================ */
  .home-hero {
    position: relative;
    padding: clamp(48px, 6vw, 88px) clamp(20px, 5vw, 40px) clamp(48px, 6vw, 72px);
    background: var(--bg);
  }
  .home-hero-inner {
    max-width: 1280px; margin: 0 auto;
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: clamp(32px, 6vw, 80px); align-items: center;
  }
  .home-hero-text {
    display: flex; flex-direction: column; gap: 22px; align-items: flex-start;
    position: relative; z-index: 2;
  }
  .home-hero-title {
    font: 700 clamp(34px, 5.4vw, 56px)/1.06 var(--font); letter-spacing: -.02em;
    color: var(--ink);
    text-wrap: balance;
    max-width: 16ch;
  }
  .home-hero-tagline {
    font: 400 clamp(16px, 1.6vw, 19px)/1.55 var(--font);
    color: var(--ink-2); max-width: 52ch;
  }
  .home-hero-cta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }

  .home-hero-visual { position: relative; }
  :root[data-theme="dark"] .home-hero-visual::before {
    content: ''; position: absolute; z-index: 0;
    left: 50%; top: 50%; width: 118%; aspect-ratio: 1; transform: translate(-50%, -50%);
    background:
      radial-gradient(circle at 50% 48%,
        rgba(255, 255, 255, .50) 0%,
        rgba(252, 251, 248, .38) 26%,
        rgba(248, 247, 243, .20) 46%,
        rgba(248, 247, 243, .07) 64%,
        transparent 78%);
    filter: blur(6px);
    pointer-events: none;
  }
  :root[data-theme="dark"] .home-hero-visual > * { position: relative; z-index: 1; }

  .home-hero-saludo {
    position: absolute; z-index: 3; left: 1%; top: 2%;
    display: inline-block; padding: 9px 15px;
    background: var(--accent-fill); color: var(--accent-ink);
    border-radius: var(--r-full) var(--r-full) var(--r-full) 6px;
    font: 700 clamp(13px, 1.3vw, 16px) var(--font); letter-spacing: -.01em;
    white-space: nowrap; box-shadow: var(--shadow-lg);
    transform-origin: left bottom;
    animation: saludo-entra .5s .35s cubic-bezier(.34, 1.56, .64, 1) both;
  }
  .home-hero-saludo::after {
    content: ''; position: absolute; left: 14px; bottom: -7px;
    border: 8px solid transparent; border-top-color: var(--accent-fill); border-bottom: 0;
    transform: skewX(-16deg);
  }
  @keyframes saludo-entra {
    from { opacity: 0; transform: scale(.7) translateY(6px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) { .home-hero-saludo { animation: none; } }
  @media (max-width: 880px) { .home-hero-saludo { left: 0; top: 0; padding: 7px 12px; } }

  .home-hero-trust-item > .home-hero-trust-ic {
    display: inline-flex; flex: none; color: var(--accent);
    width: 34px; height: 34px; align-items: center; justify-content: center;
    background: var(--accent-soft-2); border-radius: var(--r-full);
  }
  .home-hero-trust {
    display: flex; gap: clamp(20px, 4vw, 44px); margin-top: 28px; padding-top: 28px;
    border-top: 1px solid var(--border);
    width: min(100%, 520px);
  }
  .home-hero-trust-item { display: flex; align-items: center; gap: 12px; }
  .home-hero-trust-item strong {
    display: block; font: 600 14px/1.2 var(--font); color: var(--ink);
  }
  .home-hero-trust-item span {
    display: block; font: 500 12px/1.2 var(--font); color: var(--muted);
    letter-spacing: .02em;
  }

  .home-hero-visual {
    position: relative;
    aspect-ratio: 1 / 1.05;
    width: 100%; max-width: 540px; justify-self: end;
  }
  .home-hero-visual .home-hero-img {
    width: 100%; height: auto; display: block;
  }
  .home-hero-visual::after {
    content: ''; position: absolute; inset: 8% -6% -6% 8%;
    background: var(--accent); opacity: .07; z-index: -1; border-radius: 30% 50% 50% 50%;
    filter: blur(50px);
  }

  @media (max-width: 880px) {
    .home-hero-inner { grid-template-columns: 1fr; }
    .home-hero-visual { max-width: 380px; margin: 0 auto; justify-self: center; }
    .home-hero-trust { width: 100%; }
  }
  @media (max-width: 560px) {
    .home-hero-trust { flex-direction: column; gap: 14px; }
  }

  /* ================================================================
     ECOSISTEMA — BENTO GRID
     ================================================================ */
  .home-ecosystem {
    padding: clamp(56px, 7vw, 96px) clamp(20px, 5vw, 40px);
    background: var(--panel);
    border-top: 1px solid var(--border);

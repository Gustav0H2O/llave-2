<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body>
<div id="out" style="position:fixed;top:0;left:0;right:0;background:yellow;padding:8px;font:10px monospace;z-index:9999;max-height:300px;overflow:auto"></div>
<script>
const out = document.getElementById('out');
const errs = [];
window.addEventListener('error', e => {
  errs.push('WIN: ' + e.message + ' @ ' + e.lineno + ' col ' + e.colno + ' | ' + (e.error && e.error.stack ? e.error.stack : '').substring(0, 600));
  out.textContent = errs.join('\n\n');
});
window.addEventListener('unhandledrejection', e => {
  errs.push('REJ: ' + ((e.reason && e.reason.stack) || (e.reason && e.reason.message) || String(e.reason)).substring(0, 600));
  out.textContent = errs.join('\n\n');
});
setTimeout(() => {
  out.textContent = errs.length ? errs.join('\n\n') : 'no errors yet';
}, 3000);
</script>
<iframe src="/" style="width:100%;height:100vh;border:0;margin-top:300px"></iframe>
</body>
</html>

<!doctype html>
<html>
<head><meta charset="utf-8"><title>Error capture</title>
<style>body{font:12px monospace;padding:20px;background:#222;color:#0f0;white-space:pre-wrap}</style>
</head>
<body>
<script>
const errs = [];
const origErr = console.error;
console.error = function(...a) { errs.push(a.map(x => { try { return x.stack || String(x); } catch(e) { return String(x); }}).join(' ')); origErr.apply(console, a); };
window.addEventListener('error', e => errs.push('ERROR: ' + e.message + ' @ ' + e.filename + ':' + e.lineno));
window.addEventListener('unhandledrejection', e => errs.push('PROMISE: ' + (e.reason && (e.reason.stack || e.reason.message || String(e.reason)))));
setTimeout(() => {
  document.body.innerText = errs.length ? errs.join('\n\n') : 'NO ERRORS CAPTURED';
  document.title = errs.length + ' errors captured';
}, 6000);
</script>
<iframe id="f" src="/" style="width:100%;height:100vh;border:1px solid #444"></iframe>
</body>
</html>

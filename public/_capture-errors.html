<!doctype html>
<html>
<head><meta charset="utf-8"><title>Error capture</title></head>
<body>
<iframe id="f" src="http://localhost:8080/" style="width:100%;height:600px;border:1px solid #ccc"></iframe>
<pre id="out" style="white-space:pre-wrap;padding:16px;background:#222;color:#0f0;font:12px monospace"></pre>
<script>
  const out = document.getElementById('out');
  const logs = [];
  function push(label, args) {
    try {
      const msg = Array.from(args).map(a => {
        if (a instanceof Error) return a.stack || a.message;
        try { return JSON.stringify(a); } catch { return String(a); }
      }).join(' ');
      logs.push(label + ': ' + msg);
    } catch (e) { logs.push(label + ': <unserializable>'); }
  }
  window.addEventListener('error', e => push('error', [e.message + ' @ ' + e.filename + ':' + e.lineno]));
  window.addEventListener('unhandledrejection', e => push('promise', [e.reason && (e.reason.stack || e.reason.message || String(e.reason))]));
  const origLog = console.log;
  console.log = function(...a) { push('log', a); origLog.apply(console, a); };
  console.error = function(...a) { push('error', a); };
  console.warn = function(...a) { push('warn', a); };
  document.getElementById('f').addEventListener('load', () => {
    setTimeout(() => { out.textContent = logs.join('\n\n') || 'no errors captured'; }, 3000);
  });
</script>
</body>
</html>

services:
  - type: web
    name: fueltech-master
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev && npm run seed
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      # Render mete un proxy delante: el tráfico real llega con X-Forwarded-For.
      # Sin esto, Express no confía en esa cabecera y `req.ip` es SIEMPRE la IP
      # del proxy — con lo que todos los visitantes comparten un único contador:
      # el rate limit se vuelve global (un atacante tumba la API para todos los
      # talleres a la vez), el anti-abuso de reseñas deja de separar a nadie y el
      # contador de visitas de la portada marca siempre 1. Con 1 se confía en
      # toda la cadena, que es lo correcto mientras haya un solo proxy delante.
      - key: TRUST_PROXY
        value: 1
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: 1
      # Dominio público REAL del servicio (afecta canonical, sitemap, Open Graph
      # y el enlace de los correos). El de antes, fueltech-master.onrender.com,
      # NO existe: Render responde 404 x-render-routing: no-server. Cámbialo si
      # algún día conectas un dominio propio.
      - key: BASE_URL
        value: https://llave-d3me.onrender.com
      # Modelo de IA (Gemini). Ajusta solo si tu cuenta tiene acceso a otro id válido.
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      # La API key del chat se configura como secreto en el panel de Render (no en texto plano aquí).
      - key: GEMINI_API_KEY
        sync: false
      # Google Analytics 4 (ya integrado en el código; cambia el ID aquí si algún día lo necesitas).
      - key: GA_MEASUREMENT_ID
        value: G-MXGS03FKB0
      # Google AdSense. ID de editor: activa el script en todas las páginas, abre la CSP
      # para los dominios de anuncios y publica /ads.txt. Vaciarlo desactiva todo eso.
      - key: ADSENSE_CLIENT
        value: ca-pub-7076623221520706
      # Correo de contacto y nombre del editor que aparecen en las páginas legales.
      - key: CONTACT_EMAIL
        value: newpersonal98@gmail.com
      - key: SITE_OWNER
        value: FuelTech Master
      # Base de datos Turso (Persistencia permanente en la nube)
      - key: TURSO_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Asistente IA y Proveedores
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODELS
        value: openai/gpt-oss-120b,openai/gpt-oss-20b,qwen/qwen3.8-27b,qwen/qwen3.6-27b
      # Google OAuth
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # URI de retorno OAuth FIJADA (no secreta: viaja en la URL a Google).
      # El servidor la deriva del Host si falta, y eso ya mato un login con
      # invalid_grant: la URI del intercambio tiene que ser byte por byte la
      # misma que la de autorizacion y la registrada en Google Console.
      - key: GOOGLE_REDIRECT_URI
        value: https://llave-d3me.onrender.com/api/auth/google/callback
      # Contraseña del panel /admin. Configúrala como SECRETO en el panel de Render.
      # Sin esta variable, el panel de administración queda DESACTIVADO (seguro por defecto).
      - key: ADMIN_PASSWORD
        sync: false
      # Sal del contador de visitas. En producción es OBLIGATORIA: sin ella el
      # proceso no arranca (con una sal nueva en cada reinicio el mismo visitante
      # se cuenta otra vez). Render genera el valor una sola vez y lo conserva.
      - key: VISIT_SALT
        generateValue: true

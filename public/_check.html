<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body>
<iframe id="f" src="/" style="width:100%;height:100vh;border:0"></iframe>
<pre id="out" style="position:fixed;top:0;left:0;right:0;background:yellow;padding:8px;font:11px monospace;z-index:9999;max-height:200px;overflow:auto"></pre>
<script>
const out = document.getElementById('out');
const f = document.getElementById('f');
const errs = [];
f.addEventListener('load', () => {
  const w = f.contentWindow;
  const o = w.console.error;
  w.console.error = function(...a) { errs.push(a.map(x => String(x)).join(' ')); o.apply(w.console, a); };
  w.addEventListener('error', e => errs.push('WIN: ' + e.message + ' @ ' + e.lineno + ':' + e.colno + ' in ' + e.filename));
  w.addEventListener('unhandledrejection', e => errs.push('REJ: ' + (e.reason?.stack || e.reason?.message || e.reason)));
  setTimeout(() => {
    out.textContent = errs.join('\n\n') || 'NO ERRORS';
  }, 3000);
});
</script>
</body>
</html>
